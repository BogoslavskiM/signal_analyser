Before any repository-changing task, request the DevOps clean-worktree gate and
`neuro_*` branch preparation. If DevOps reports local changes, stop agent work
until the user resolves them.

Start MATLAB Researcher in parallel when a reference application is relevant.
Receive notifications for every direct MATLAB Researcher -> E2E scenario
