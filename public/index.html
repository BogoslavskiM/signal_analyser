<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анализатор сигналов</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <main class="signal-analyser" data-testid="app-shell" aria-label="Анализатор сигналов">
    <header class="app-toolbar">
      <div class="app-brand" aria-label="Engee">
        <svg class="engee-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 9.5C7.8 5.7 12 4 16 4s8.2 1.7 11 5.5l-4.1 2.2A8.5 8.5 0 0 0 16 8c-2.7 0-5.2 1.3-6.9 3.7L5 9.5Zm22 13C24.2 26.3 20 28 16 28s-8.2-1.7-11-5.5l4.1-2.2A8.5 8.5 0 0 0 16 24c2.7 0 5.2-1.3 6.9-3.7l4.1 2.2ZM4 13h24v6H4z"/></svg>
        <span class="engee-name">engee</span>
      </div>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <h1>Анализатор сигналов</h1>
      <span class="app-version">Версия 1.0.0</span>
    </header>

    <div class="application-body">
      <section class="workspace" aria-label="Графики">
        <div class="plot-grid" data-testid="plot-grid">
          <article class="plot-card" data-plot="time" data-testid="plot-card-time" tabindex="0" role="button" aria-label="Выбрать график Время">
            <header class="plot-card-header"><h2>Время</h2><span class="plot-card-kind">Линия</span></header>
            <div class="plot-host" data-plot-host="time" aria-label="График Время"></div>
          </article>
          <article class="plot-card" data-plot="spectrum" data-testid="plot-card-spectrum" tabindex="0" role="button" aria-label="Выбрать график Спектр">
            <header class="plot-card-header"><h2>Спектр</h2><span class="plot-card-kind">Welch</span></header>
            <div class="plot-host" data-plot-host="spectrum" aria-label="График Спектр"></div>
          </article>
          <article class="plot-card" data-plot="spectrogram" data-testid="plot-card-spectrogram" tabindex="0" role="button" aria-label="Выбрать график Спектрограмма">
            <header class="plot-card-header"><h2>Спектрограмма</h2><span class="plot-card-kind">Тепловая карта</span></header>
            <div class="plot-host" data-plot-host="spectrogram" aria-label="График Спектрограмма"></div>
          </article>
          <article class="plot-card" data-plot="persistence" data-testid="plot-card-persistence" tabindex="0" role="button" aria-label="Выбрать график Спектр персистентности">
            <header class="plot-card-header"><h2>Спектр персистентности</h2><span class="plot-card-kind">Тепловая карта</span></header>
            <div class="plot-host" data-plot-host="persistence" aria-label="График Спектр персистентности"></div>
          </article>
        </div>
      </section>

      <aside class="active-plot-panel" data-testid="active-plot-panel" aria-live="polite">
        <header class="panel-heading"><h2>Параметры отображения</h2></header>
        <div class="panel-content">
          <h3 data-testid="active-plot-title">Параметры</h3>
          <dl class="plot-fields" data-panel-fields></dl>
        </div>
      </aside>
    </div>

    <section class="signals-section" aria-labelledby="signals-title">
      <header class="signals-heading"><h2 id="signals-title">Сигналы</h2><span data-signal-count></span></header>
      <div class="signal-table-scroll">
        <table class="signal-table" data-testid="signal-table">
          <thead><tr><th>Сигнал</th><th>Цвет</th><th>Частота дискретизации</th><th>Отсчёты</th><th>Длительность</th><th>Тип</th></tr></thead>
          <tbody data-signal-rows></tbody>
        </table>
      </div>
    </section>

    <div class="app-status" aria-live="polite">
      <div class="app-loading" data-testid="app-loading" hidden role="status"><span class="spinner" aria-hidden="true"></span><span data-loading-text>Загрузка данных…</span></div>
      <div class="app-error" data-testid="app-error" hidden role="alert"><span data-error-text></span><button type="button" class="retry-button" data-retry>Повторить</button></div>
    </div>
  </main>
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
