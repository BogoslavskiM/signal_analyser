product_goal: "Единые настройки осей, спектральный анализ и управляемый жизненный цикл экранов, областей и сигналов"
scope:
  - "Добавить в группу «Параметры» страницы «Область» независимые чекбоксы показа слайдера диапазона X и слайдера амплитуды Y."
  - "Синхронизировать чекбоксы с существующими пунктами меню области и с pane-local session state без API и перерасчёта DSP."
  - "Показывать чекбоксы только для готовой временной области с данными; для остальных контекстов скрывать, а не выводить заглушки."
  - "Отображать локальные пределы времени и амплитуды на странице «Область» тем же компонентом, что экранные пределы: два текстовых поля и двойной слайдер."
  - "Сохранить пустые Min/Max как auto-границы и одинаковые единицы, шаг, double-click reset, валидацию и визуальные состояния."
  - "При включённой связи переносить соответствующий предел на страницу «Экран» и применять его ко всем совместимым областям; при выключенной связи оставлять pane-local семантику."
  - "Проецировать положение экстремумов из канонических секунд в фактически выбранные единицы времени активной области; таблица, маркеры и ось используют одну и ту же проекцию."
  - "Разрешить расчёт экстремумов для спектра по фактически отображаемой спектральной ординате и показывать позицию в выбранных единицах частоты."
  - "Разрешить для спектра независимые горизонтальный слайдер частоты и вертикальный слайдер магнитуды."
  - "Добавить экранные связи «Связать частоты спектров» и «Связать магнитуды спектров» с отдельными группами пределов частоты и магнитуды на страницах «Область» и «Экран»."
  - "Сохранять стабильные пользовательские имена экранов и областей; удаление экрана не перенумеровывает оставшиеся экраны."
  - "Добавить первой вкладку настроек «Сигнал» для main_signal: имя, цвет, частота дискретизации, сводка измерений и переход к отсчётам."
  - "Добавить в нижний inspector динамическую вкладку main_signal с лениво загружаемыми отсчётами: номер, время, значение, модуль и квадрат."
  - "Добавить атомарные операции создания производного сигнала: модуль, квадрат, корень, знаковый корень модуля, умножение, FFT и пользовательское Julia-преобразование, выполняемое непосредственно в production Engee."
  - "Добавить в меню области независимый выбор одного или двух интерактивных курсоров графика без backend-перерасчёта."
out_of_scope:
  - "Изменение DSP-математики и Plotly payload."
  - "Сохранение видимости pane sliders в backend session или между перезагрузками страницы."
  - "Связь между разными экранами."
  - "Связь временных и спектральных осей между собой."
  - "Загрузка полного массива отсчётов в state-lite или единым frontend payload."
legacy_reuse:
  - "Существующие rangeSliderByPane/amplitudeSliderByPane и Plotly.relayout handlers."
  - "Существующий screenRangeSliderMarkup и настройки time.x_limits/time.y_limits."
  - "Канонические SignalPeakItem.time_s и sample_index; повторный DSP-расчёт при смене единиц не требуется."
  - "Существующие EngeeDSPSpectrumProvider, signal_spectrum_calculate и typed spectrum settings; production contract должен быть повторно подтверждён."
  - "Существующие state_revision, signal bindings, cache invalidation и duplicate/delete inventory boundaries для атомарных signal operations."
legacy_forbidden_reuse:
  - genie_reactive_variables_and_structures
  - backend_generated_frontend
  - frontend_directly_bound_to_backend_reactive_state

layout:
  source: "user description plus current analytical-dense settings panel"
  reference: "architecture/design/TASK-0080-explicit-apply-flow/DESIGN.md"
  zones:
    - id: plot_workspace
      purpose: "Графики областей и pane-local Plotly controls"
    - id: display_settings
      purpose: "Вкладки «Область», «Экран», «Экстремумы» с автоматическим сохранением"
    - id: lower_inspector
      purpose: "Сигналы, измерения и экстремумы"

capabilities:
  toolbar: present
  settings: present
  data_tables: present
  graphs: present
  dialogs: present
  import_export: present

scenarios:
  - "Пользователь изменяет валидную настройку сигнала, области, экрана или экстремумов; значение автоматически последовательно сохраняется и применяется без общей кнопки Apply."
  - "Пользователь нажимает единственную кнопку «Рассчитать» во вкладке «Экстремумы»; отсутствующий или устаревший результат рассчитывается, готовый результат открывается в нижней таблице."
  - "Пользователь включает или выключает горизонтальный/амплитудный слайдер чекбоксом в «Область → Параметры»; соответствующий pane menu item немедленно отражает то же состояние."
  - "Пользователь задаёт локальные X/Y пределы полями или двойным слайдером; изменения применяются только к активной области при выключенной связи."
  - "Пользователь включает связь времени или амплитуды; соответствующий идентичный range control исчезает из «Область» и появляется в «Экран», а Apply охватывает совместимые области текущего экрана."
  - "Пустая граница Min/Max остаётся пустой и означает auto full range; double click возвращает обе границы в auto."
  - "Пользователь меняет единицы времени с секунд на мс, мкс, нс или auto; рассчитанные экстремумы остаются на тех же отсчётах и немедленно занимают правильные X-позиции в новых единицах без повторного расчёта."
  - "Пользователь выбирает область спектра, включает слайдер частоты и/или магнитуды, рассчитывает экстремумы и видит маркеры на тех же спектральных бинах, что и отображаемая кривая."
  - "Пользователь связывает частоты или магнитуды спектров; соответствующая группа limits сразу перемещается в «Экран» и Apply распространяет её только на spectrum panes текущего экрана."
  - "Пользователь удаляет «Экран 2»; «Экран 3» сохраняет имя и идентичность, а новый экран получает новый неиспользованный default ordinal."
  - "Пользователь переименовывает экран, область или main_signal; ссылки, bindings, session и кэши обновляются атомарно."
  - "Пользователь открывает «Сигнал», меняет metadata main_signal, просматривает summary и кнопкой «Значения» открывает ленивую таблицу отсчётов."
  - "Пользователь создаёт производный сигнал встроенной операцией либо пользовательским преобразованием, задаёт имя и явно разрешает или запрещает перезапись."
  - "Пользователь включает в меню области один или два курсора, перемещает их по текущему видимому X-диапазону и считывает координаты ближайших точек видимых трасс."
product_decisions:
  - "Общая кнопка «Применить» отсутствует; валидные настройки автоматически сохраняются и публикуются через существующий revision-safe API."
  - "Автосохранение настроек не запускает eager DSP: расчёт графика остаётся lazy по запросу активного output, а экстремумы запускаются явной кнопкой «Рассчитать»."
  - "Оба чекбокса являются альтернативным входом к существующему pane-local frontend state, не новыми настройками backend."
  - "Пределы на страницах «Область» и «Экран» используют один frontend component/provider и отличаются только scope."
  - "Слайдер диапазона и слайдер амплитуды независимы и могут быть включены одновременно."
  - "Недоступные controls скрываются полностью."
  - "Backend/domain сохраняют время экстремума только в секундах; response projection добавляет отображаемую X-координату и обозначение фактически разрешённой единицы, а frontend не выполняет второй пересчёт."
  - "Спектральный экстремум имеет канонические bin_index и frequency_hz; расчёт выполняется над той ординатой, которая отображается после выбранного scale/normalization contract."
  - "Time X/Y links и Spectrum frequency/magnitude links — четыре независимых флага с отдельными draft/applied values."
  - "Display/pane names являются persisted domain fields; frontend никогда не строит имя из текущего array index."
  - "Таблица отсчётов использует backend pagination/virtualization и не входит в state-lite."
  - "Операция над сигналом сначала вычисляет и валидирует candidate off-state, затем одной revision-checked транзакцией создаёт либо заменяет сигнал и инвалидирует зависимые outputs."
  - "Пользовательский operation body скрыто оборачивается backend в `let init_signal = <remote scratch>; <body>; end` и выполняется через `engee.genie.recv(...; context=Main)`; wrapper, scratch transport и cleanup не показываются в UI."
  - "Вход и результат передаются collision-free чанками не более 50 000 отсчётов, каждый send подтверждается OK payload и remote round-trip; временные имена очищаются в finally и никогда не переиспользуются."
  - "Пользовательский Julia body выполняется без sandbox в Engee Main; продукт не заявляет изоляцию filesystem/workspace/network и не скрывает это в техническом контракте."
  - "Один и два курсора являются взаимоисключающими pane-local frontend-режимами; повторный выбор активного режима выключает курсоры и не меняет backend state_revision."
open_questions: []
acceptance_criteria:
  - "В панели настроек отсутствует общая кнопка Apply; видимая footer-action существует только на странице «Экстремумы» и называется «Рассчитать»."
  - "Все валидные видимые настройки сохраняются автоматически через сериализованный stale-safe pipeline; невалидные и скрытые поля не отправляются."
  - "В «Область → Параметры» видны два чекбокса с единым стилем существующих boolean settings."
  - "Checkbox, pane menu aria-checked и фактическая Plotly slider visibility всегда синхронны после rerender, смены активной области и output refresh."
  - "Toggle не вызывает /api/outputs/active, layouts/settings POST, state_revision change или Plotly remount."
  - "Local X/Y limits и Screen X/Y limits визуально и функционально используют идентичные fields + double range slider."
  - "Linked/unlinked перенос controls происходит сразу и не теряет применённые значения."
  - "Для s/ms/μs/ns и auto маркер экстремума совпадает с исходным отсчётом графика; таблица показывает то же спроецированное время и единицу."
  - "Смена единиц не вызывает POST /api/peaks/active и не инвалидирует результат DSP; обновляется только проекция готового результата."
  - "Экстремумы spectrum используют правильные bin/frequency coordinates во всех frequency units и не смешиваются с time extrema cache contexts."
  - "Spectrum frequency/magnitude sliders доступны независимо и синхронны с pane menu/checkboxes."
  - "Четыре screen link flags применяют limits только к совместимым panes и одним Apply revision."
  - "Production Engee contract tests подтверждают реальные функции spectrum, windows, FFT и extrema; browser/backend tests не подменяют эту проверку."
  - "Stable display/pane names проходят add/delete/layout/session round-trip без перенумерации."
  - "Signal tab metadata edits, summary и sample table работают для real/complex и больших сигналов без полного payload."
  - "Все signal operations типизированы, revision-safe и не оставляют частично заменённого сигнала при ошибке."
  - "Меню области содержит «Курсор» и «Два курсора»; курсоры работают поверх Time и Spectrum графиков, не изменяют zoom/sliders и не запускают API/DSP."
  - "Frontend static/behavior regression и production foreground E2E проходят."
