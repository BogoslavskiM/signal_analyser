product_goal: "Единые настройки осей, спектральный анализ и управляемый жизненный цикл экранов, областей и сигналов"
scope:
  - "Добавить в группу «Параметры» страницы «Область» независимые чекбоксы показа слайдера диапазона X и слайдера амплитуды Y."
  - "Синхронизировать чекбоксы с существующими пунктами меню области и с pane-local session state без API и перерасчёта DSP."
  - "Показывать чекбоксы только для готовой временной области с данными; для остальных контекстов скрывать, а не выводить заглушки."
  - "Отображать локальные пределы времени и амплитуды на странице «Область» тем же компонентом, что экранные пределы: два текстовых поля и двойной слайдер."
  - "Сохранить пустые Min/Max как auto-границы и одинаковые единицы, шаг, double-click reset, валидацию и визуальные состояния."
  - "При включённой связи переносить соответствующий предел на страницу «Экран» и применять его ко всем совместимым областям; при выключенной связи оставлять pane-local семантику."
  - "Проецировать положение экстремумов из канонических секунд в фактически выбранные единицы времени активной области; таблица, маркеры и ось используют одну и ту же проекцию."
  - "Разрешить расчёт экстремумов для спектра по фактически отображаемой спектральной ординате и показывать позицию в выбранных единицах частоты."
  - "Разрешить для спектра независимые горизонтальный слайдер частоты и вертикальный слайдер магнитуды."
  - "Добавить экранные связи «Связать частоты спектров» и «Связать магнитуды спектров» с отдельными группами пределов частоты и магнитуды на страницах «Область» и «Экран»."
  - "Сохранять стабильные пользовательские имена экранов и областей; удаление экрана не перенумеровывает оставшиеся экраны."
  - "Добавить первой вкладку настроек «Сигнал» для main_signal: имя, цвет, частота дискретизации, сводка измерений и переход к отсчётам."
  - "Добавить в нижний inspector динамическую вкладку main_signal с лениво загружаемыми отсчётами: номер, время, значение, модуль и квадрат."
  - "Заменить старый набор математических операций в окне «Операция над сигналом» на подтверждённый Engee User набор системных операций препроцессинга Engee/EngeeDSP: полосовой и режекторный фильтры, ФВЧ, ФНЧ, удаление тренда, заполнение пропусков, сглаживание, огибающую, передискретизацию и пользовательскую операцию."
  - "Использовать выбранный ЛКМ сигнал как единственный исходный сигнал препроцессинга; для каждой операции показывать только подтверждённые параметры, defaults, единицы и ограничения на русском языке."
  - "Подтвердить реальный расчёт экстремумов Time и Spectrum с заполнением таблицы и маркерами графика, а также полный поток обрезки по двум курсорам."
  - "Выполнять расчёт и опрос готовности экстремумов в фоне контекста display/pane: навигация по вкладкам остаётся доступной, а готовый результат появляется без обновления страницы."
  - "Показывать компактное действие пересчёта экстремумов справа в строке вкладок inspector и использовать в селекторе операции один интерактивный trigger без вложенных input/button."
  - "Хранить рассчитанные экстремумы, признаки готовности/успеха/ошибки и need_update непосредственно в состоянии каждой области; явный расчёт ставит текущую область первой в общую последовательную очередь."
  - "Всегда восстанавливать маркеры рассчитанных экстремумов для пока существующих графиков области при initial render, rerender, навигации, zoom и layout changes; удалённый график немедленно теряет свои маркеры."
  - "Добавить рядом с действием «Рассчитать/Пересчитать» действие «Очистить», которое очищает рассчитанные экстремумы только текущей области."
  - "При автомасштабировании Time/Spectrum учитывать рассчитанные marker overlays и оставлять визуальный запас под треугольник и номер экстремума, не превращая Auto в persisted hard limits."
  - "При фактической смене типа области очищать сохранённые экстремумы этой области; применение того же типа не очищает результат."
  - "В header области выровнять высоту селектора типа графика по соседним кнопкам и размещать «Обрезать» как отдельный элемент слева без уменьшения штатной ширины селектора."
  - "В header области центрировать «Обрезать» по вертикали и исключить повторное dropdown-оформление внутреннего input: одна внешняя рамка, одно скругление и без внутреннего gap."
  - "Перенести действия очистки и пересчёта экстремумов из строки inspector tabs в крайнюю правую ячейку строки заголовков таблицы и заменить текстовые кнопки на корзину и круговую стрелку."
  - "Пока готовой таблицы экстремумов нет, всегда показывать по центру белой области явную кнопку «Рассчитать», сохраняя её место в pending-состоянии."
  - "Добавить в меню области независимый выбор одного или двух интерактивных курсоров графика без backend-перерасчёта."
  - "Провести полный аудит всех выпадающих списков приложения и привести triggers, popovers, states, positioning, keyboard behavior и overlay layers к единому принятому design contract."
  - "Оформить hover/focus-подсказки по принятым визуальным примерам и добавить их всем кнопкам, смысл которых выражен иконкой, символом, сокращением или обрезанным текстом."
  - "Привести processing-состояние всех синих Primary-кнопок к компоненту Engee Primary LG: светло-синий фон, белый текст и белый вращающийся loader слева от текста без изменения геометрии кнопки."
  - "Применить hover эталонной кнопки управления нижней зоной к кнопкам добавления экрана и выбора макета, включая акцентный foreground и перекраску их SVG/иконок."
  - "Привести окно «Операция над сигналом» к типовой компактной форме: уменьшить ширину modal и controls, перенести единицы измерения к названию параметра и показывать field validation до submit."
out_of_scope:
  - "Локальные математические замены системных функций Engee и неявное подключение сторонних DSP-библиотек."
  - "Сохранение видимости pane sliders в backend session или между перезагрузками страницы."
  - "Связь между разными экранами."
  - "Связь временных и спектральных осей между собой."
  - "Загрузка полного массива отсчётов в state-lite или единым frontend payload."
legacy_reuse:
  - "Существующие rangeSliderByPane/amplitudeSliderByPane и Plotly.relayout handlers."
  - "Существующий screenRangeSliderMarkup и настройки time.x_limits/time.y_limits."
  - "Канонические SignalPeakItem.time_s и sample_index; повторный DSP-расчёт при смене единиц не требуется."
  - "Существующие EngeeDSPSpectrumProvider, signal_spectrum_calculate и typed spectrum settings; production contract должен быть повторно подтверждён."
  - "Существующие state_revision, signal bindings, cache invalidation и duplicate/delete inventory boundaries для атомарных signal operations."
legacy_forbidden_reuse:
  - genie_reactive_variables_and_structures
  - backend_generated_frontend
  - frontend_directly_bound_to_backend_reactive_state

