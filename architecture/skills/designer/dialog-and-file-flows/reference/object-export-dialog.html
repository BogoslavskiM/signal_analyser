<base-dialog
  :open="objectExportDialog.open"
  title="Экспорт"
  title-id="object-export-title"
  size="form"
  level="primary"
  :busy="objectExportDialog.busy"
  @close="closeObjectExportDialog"
>
  <div class="object-export-fields">
    <label class="object-export-row" for="object-export-operation">
      <span>Тип экспорта</span>
      <select
        id="object-export-operation"
        data-testid="object-export-operation"
        class="object-export-select"
        :value="objectExportDialog.active_operation"
        :disabled="objectExportSelectorDisabled"
        @change="changeObjectExportOperation($event.target.value)"
      >
        <option v-for="operation in objectExportDialog.operations" :key="operation.id" :value="operation.id">
          {{ operation.label }}
        </option>
      </select>
    </label>

    <component
      :is="activeObjectExportForm"
      class="object-export-operation-form"
      :operation-state="objectExportDialog.operation_state"
      :field-errors="objectExportDialog.field_errors"
      :busy="objectExportDialog.busy"
      @update-field="updateObjectExportField"
    ></component>
  </div>

  <template #actions>
    <button class="dialog-button" data-testid="object-export-cancel" type="button" :disabled="objectExportDialog.busy" @click="closeObjectExportDialog">Отмена</button>
    <button class="dialog-button dialog-button-primary" data-testid="object-export-submit" type="button" :disabled="objectExportDialog.busy || !objectExportDialog.active_operation" @click="submitObjectExport">
      {{ objectExportDialog.busy ? "Экспорт..." : "Экспортировать" }}
    </button>
  </template>
</base-dialog>
