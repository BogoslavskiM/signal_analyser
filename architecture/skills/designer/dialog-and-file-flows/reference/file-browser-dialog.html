<base-dialog
  :open="fileBrowser.open"
  :title="fileBrowserTitle"
  title-id="file-browser-title"
  size="message"
  level="file-browser"
  :busy="fileBrowser.busy"
  @close="cancelFileBrowser"
>
  <div class="file-browser-layout">
    <button class="file-browser-heading" data-testid="file-browser-sort" type="button" :disabled="fileBrowser.busy" @click="toggleFileBrowserSort">
      <span>Имя</span>
      <span aria-hidden="true">{{ fileBrowser.sort_ascending ? "↑" : "↓" }}</span>
    </button>

    <div class="file-browser-list-wrap">
      <div class="file-browser-list">
        <div v-if="!fileBrowserAtRoot" class="file-browser-row">
          <span></span>
          <button class="file-browser-entry" data-testid="file-browser-parent" type="button" :disabled="fileBrowser.busy" @click="changeFileBrowserPath(fileBrowser.parent_path)">
            <span class="file-browser-entry-name">..</span>
          </button>
        </div>

        <div
          v-for="entry in fileBrowser.entries"
          :key="entry.path"
          class="file-browser-row"
          :class="{ 'is-expanded': entry.expanded, 'is-selected': fileBrowser.selected_path === entry.path, 'is-disabled': entry.selectable === false }"
          :style="{ paddingLeft: (12 + Number(entry.depth || 0) * 24) + 'px' }"
        >
          <button
            class="file-browser-caret"
            type="button"
            :disabled="fileBrowser.busy || entry.kind !== 'directory' || entry.selectable === false"
            :aria-label="entry.expanded ? 'Свернуть папку' : 'Развернуть папку'"
            :data-testid="'file-browser-toggle-' + entry.path"
            @click="toggleFileBrowserPath(entry.path)"
          ></button>
          <button
            class="file-browser-entry"
            type="button"
            :disabled="fileBrowser.busy || entry.selectable === false"
            :title="entry.path"
            :data-tooltip="entry.path"
            :data-testid="'file-browser-entry-' + entry.path"
            @click="selectFileBrowserEntry(entry)"
          >
            <span class="file-browser-entry-name">{{ entry.name }}</span>
          </button>
        </div>

        <div v-if="!fileBrowser.entries.length" class="file-browser-empty" data-testid="file-browser-empty">В этой папке нет элементов</div>
      </div>

      <div v-if="fileBrowser.busy" class="file-browser-loading" data-testid="file-browser-loading" role="status" aria-label="Загрузка">
        <span class="file-browser-spinner" aria-hidden="true"></span>
      </div>
    </div>

    <div class="file-browser-path">
      <span
        class="file-browser-path-text"
        :title="fileBrowser.mode === 'file' && fileBrowser.selected_path ? fileBrowser.selected_path : fileBrowser.current_path"
        :data-tooltip="fileBrowser.mode === 'file' && fileBrowser.selected_path ? fileBrowser.selected_path : fileBrowser.current_path"
      >{{ fileBrowser.mode === "file" && fileBrowser.selected_path ? fileBrowser.selected_path : fileBrowser.current_path }}</span>
    </div>
  </div>

  <template #actions>
    <button class="dialog-button" data-testid="file-browser-cancel" type="button" :disabled="fileBrowser.busy" @click="cancelFileBrowser">Отменить</button>
    <button class="dialog-button dialog-button-primary" data-testid="file-browser-select" type="button" :disabled="!fileBrowserCanSelect" @click="selectFileBrowserValue">Выбрать</button>
  </template>
</base-dialog>
