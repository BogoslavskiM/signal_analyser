<header class="application-toolbar" data-testid="app-toolbar">
  <div class="application-toolbar-brand">
    <img class="application-toolbar-logo" :src="toolbarLogoPath" alt="Engee">
    <h1 class="application-toolbar-title">{{ toolbarAppName }}</h1>
    <span class="application-toolbar-separator" aria-hidden="true"></span>
    <span class="application-toolbar-version">Версия {{ app_version }}</span>
  </div>

  <div class="application-toolbar-actions">
    <button
      v-if="toolbarImportAction.visible"
      class="application-toolbar-button application-toolbar-icon"
      type="button"
      :style="toolbarIconStyle(toolbarImportAction.icon)"
      :disabled="toolbarImportAction.disabled"
      :data-tooltip="toolbarImportAction.label"
      :aria-label="toolbarImportAction.label"
      data-testid="toolbar-import"
      @click="runToolbarImport"
    ></button>

    <div
      v-if="toolbarExportAction.visible"
      class="application-toolbar-export"
      data-toolbar-export
    >
      <button
        class="application-toolbar-button application-toolbar-icon application-toolbar-export-primary"
        :class="{ 'application-toolbar-export-single': !toolbarExportHasMenu }"
        type="button"
        :style="toolbarIconStyle(toolbarExportAction.icon)"
        :disabled="toolbarExportAction.disabled"
        :data-tooltip="toolbarExportAction.label"
        :aria-label="toolbarExportAction.label"
        data-testid="toolbar-export-primary"
        @click="runDefaultToolbarExport"
      ></button>
      <button
        v-if="toolbarExportHasMenu"
        class="application-toolbar-button application-toolbar-export-arrow"
        type="button"
        :disabled="toolbarExportAction.disabled"
        data-tooltip="Другие способы экспорта"
        aria-label="Другие способы экспорта"
        aria-haspopup="menu"
        :aria-expanded="toolbarExportMenuOpen ? 'true' : 'false'"
        data-testid="toolbar-export-toggle"
        @click.stop="toggleToolbarExportMenu"
      >
        <span aria-hidden="true"></span>
      </button>

      <teleport to="body">
        <div
          v-if="toolbarExportMenuOpen"
          class="application-toolbar-export-menu"
          role="menu"
          data-toolbar-export
          data-testid="toolbar-export-menu"
          :style="toolbarExportMenuStyle"
        >
          <button
            v-for="operation in toolbarExportAction.operations"
            :key="operation.id"
            class="application-toolbar-export-item"
            type="button"
            role="menuitem"
            :disabled="operation.disabled"
            :data-testid="'toolbar-export-' + operation.id"
            @click="runToolbarExportOperation(operation)"
          >
            <span
              class="application-toolbar-export-item-icon application-toolbar-icon"
              :style="toolbarIconStyle(operation.icon)"
              aria-hidden="true"
            ></span>
            <span class="application-toolbar-export-item-label">{{ operation.label }}</span>
          </button>
        </div>
      </teleport>
    </div>

    <button
      v-for="action in toolbarOtherActions"
      :key="action.id"
      class="application-toolbar-button application-toolbar-icon"
      type="button"
      :style="toolbarIconStyle(action.icon)"
      :disabled="action.disabled"
      :data-tooltip="action.label"
      :aria-label="action.label"
      :data-testid="'toolbar-action-' + action.id"
      @click="runToolbarOtherAction(action)"
    ></button>

    <a
      v-if="toolbarHelpAction.visible && !toolbarHelpAction.disabled"
      class="application-toolbar-button application-toolbar-icon"
      :style="toolbarIconStyle(toolbarHelpAction.icon)"
      :href="toolbarHelpAction.href"
      target="_blank"
      rel="noopener noreferrer"
      :data-tooltip="toolbarHelpAction.label"
      :aria-label="toolbarHelpAction.label"
      data-testid="toolbar-help"
      @click="closeToolbarExportMenu"
    ></a>
    <button
      v-else-if="toolbarHelpAction.visible"
      class="application-toolbar-button application-toolbar-icon"
      type="button"
      :style="toolbarIconStyle(toolbarHelpAction.icon)"
      disabled
      :data-tooltip="toolbarHelpAction.label"
      :aria-label="toolbarHelpAction.label"
      data-testid="toolbar-help"
    ></button>
  </div>
</header>
