schema_version: 1
name: page-sizing-contract
version: 1.0.0
title: "Page Sizing Contract"
description: >
  Формирует Designer-owned контракт минимального размера приложения и зон,
  неизменяемой при resize раскладки, пропорционального роста и прокрутки при
  viewport меньше минимального application canvas.
language: ru
audience: [assistant]
priority: 0.95
when-to-use:
  - "Проектируется или изменяется application page, shell, zone layout или resize behavior"
  - "Нужно определить минимальные размеры приложения и его растягиваемых зон"
  - "Frontend запросил уточнение геометрии при большом или слишком маленьком viewport"
when-not:
  - "Меняется только изолированное состояние элемента без влияния на размеры страницы"
  - "Нужно реализовать уже готовый sizing contract в production CSS"
requires-tools: []
requires-products: []
reference-files: []
