schema_version: 1
name: visual-system
version: 4.1.0
title: "Visual System Designer"
description: >
  Формирует визуальную систему Engee-приложения: corporate Figma references,
  themes, local Roboto typography, canonical colors/menus/proportions, complete
  SVG templates, source-derived dimensions/radii, interaction states и visual
  accessibility и canonical white/grey Plotly modebar.
language: ru
audience: [assistant]
priority: 0.95
when-to-use:
  - "Для каждого design_task или design_revision"
  - "Нужно определить или применить общую визуальную систему приложения"
when-not:
  - "Нужно связать production UI с API или backend state"
requires-tools: []
requires-products: []
