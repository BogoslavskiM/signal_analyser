<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engee icon templates</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { padding: 24px; }
    h1, h2 { margin: 0 0 16px; }
    h2 { margin-top: 28px; }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    .icon-card { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
    .icon-card img { width: 24px; height: 24px; flex: 0 0 24px; object-fit: contain; }
    .icon-card code { min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>Engee icon templates</h1>
  <section class="icon-grid" aria-label="Common icons">
    <figure class="ui-panel icon-card"><img src="icons/Spinner.svg" alt=""><code>Spinner.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/chevron-down-fill-16.svg" alt=""><code>chevron-down-fill-16.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/close.svg" alt=""><code>close.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/copy.svg" alt=""><code>copy.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/download.svg" alt=""><code>download.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/engee-logo.svg" alt=""><code>engee-logo.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/eye-off.svg" alt=""><code>eye-off.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/eye.svg" alt=""><code>eye.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/favicon-engee-16.svg" alt=""><code>favicon-engee-16.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/file.svg" alt=""><code>file.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/folder-browser.svg" alt=""><code>folder-browser.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/folder-caret.svg" alt=""><code>folder-caret.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/folder-down.svg" alt=""><code>folder-down.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/folder.svg" alt=""><code>folder.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/function.svg" alt=""><code>function.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/help-circle.svg" alt=""><code>help-circle.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/import.svg" alt=""><code>import.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/jld2-file.svg" alt=""><code>jld2-file.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/more-vertical.svg" alt=""><code>more-vertical.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/multiply.svg" alt=""><code>multiply.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/plus.svg" alt=""><code>plus.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/save.svg" alt=""><code>save.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/script.svg" alt=""><code>script.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/search.svg" alt=""><code>search.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/session.svg" alt=""><code>session.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/sliders.svg" alt=""><code>sliders.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/tick-figma.svg" alt=""><code>tick-figma.svg</code></figure>

    <figure class="ui-panel icon-card"><img src="icons/plot-settings/autocorrelation.svg" alt=""><code>autocorrelation.svg</code></figure>
    <figure class="ui-panel icon-card"><img src="icons/plot-settings/contour.svg" alt=""><code>contour.svg</code></figure>

</html>
