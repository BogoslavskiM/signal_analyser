<section class="ui-panel" data-style-showcase>
  <h2 class="ui-heading">Настройки</h2>
  <button class="ui-button ui-button-primary" type="button">Применить</button>
  <button class="ui-icon-button" type="button" aria-label="Добавить" data-tooltip="Добавить">
    <span class="ui-icon icon-add" aria-hidden="true"></span>
  </button>
  <label>
    <span>Значение</span>
    <input class="ui-control" type="text">
  </label>
  <label>
    <span>Вариант</span>
    <select class="ui-control">
      <option>Первый</option>
      <option>Второй</option>
    </select>
  </label>
  <label>
    <input class="ui-checkbox" type="checkbox">
    <span>Включено</span>
  </label>

  <div class="ui-menu is-static" role="listbox" aria-label="Варианты настройки">
    <div class="ui-menu-title">Выберите вариант</div>
    <button class="ui-menu-item is-selected" type="button" role="option" aria-selected="true">Первый</button>
    <button class="ui-menu-item" type="button" role="option" aria-selected="false">Второй</button>
  </div>
</section>
