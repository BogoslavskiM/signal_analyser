schema_version: 2
name: e2e-workflow
version: 2.0.0
title: "Workflow E2E"
description: >
  Обязательный процесс E2E, типовая архитектура test/playwright, стек Node.js,
  Playwright Core, Chromium/CDP и три режима regression без deployment
  ownership; intake, page inspection, authoring и report остаются этапами workflow.
language: ru
audience: [assistant]
priority: 1.0
