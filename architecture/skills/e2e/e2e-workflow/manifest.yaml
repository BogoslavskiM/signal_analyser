  - "После каждой завершённой task, для новой функции или при пустом backlog"
when-not:
  - "Для unit/contract tests или deployment; deployment принадлежит DevOps"
requires-tools:
  - "Node.js"
  - "Chromium/CDP"
requires-products:
  - "Playwright Core"
reference-files: []
requires-skills: []
