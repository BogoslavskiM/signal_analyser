schema_version: 1
name: e2e-workflow
version: 6.2.0
title: "Workflow E2E"
description: >
  Обязательный процесс E2E, типовая архитектура test/playwright, стек Node.js,
  Playwright Core, Chromium/CDP и три режима regression без deployment
  ownership; clickable local design-contract analysis, Engee-only product
  runtime, user-visible foreground Chrome, maintenance-screen routing и
  overlay-stack/page-sizing verification и cleanup только созданных run
  Chrome-вкладок обязательны.
language: ru
audience: [assistant]
priority: 1
when-to-use:
  - "Получен E2E handoff после завершённой task, для новой функции или idle analysis"
when-not:
  - "Для unit/contract tests, Git или deployment"
requires-tools: []
requires-products:
  - "Node.js"
  - "Playwright Core"
  - "Google Chrome"
reference-files: []
