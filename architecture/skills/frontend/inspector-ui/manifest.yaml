schema_version: 1
name: inspector-ui
version: 3.0.0
title: "Inspector UI"
description: >
  Техническая реализация inspector table/list: authoritative snapshots, main
  object, selection, CRUD actions, search, columns, typed cells and stale
  request guards и eye/eye-off column visibility по Designer contract.
language: ru
audience: [assistant]
priority: 0.9
when-to-use:
  - "Нужно реализовать inspector объектов"
  - "Нужна таблица или список с main object и selection"
  - "Нужно добавить CRUD, поиск, управление колонками или форматирование cells"
when-not:
  - "Нужно реализовать backend inspector state"
  - "Нужны pagination, sorting или reorder"
requires-tools: []
requires-products: []
reference-files:
  - "reference/template.js"
