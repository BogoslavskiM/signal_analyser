<section class="inspector-panel">
  <h2 class="inspector-title">{{ inspectorUi.title }}</h2>
  <p class="inspector-description">{{ inspectorUi.description }}</p>

  <div class="inspector-window">
    <div class="inspector-toolbar">
      <div class="inspector-search-control">
        <span class="inspector-search-icon" aria-hidden="true"></span>
        <input
          class="inspector-search"
          type="search"
          autocomplete="off"
          placeholder="Введите название"
          data-testid="inspector-search"
          v-model="inspectorUi.searchQuery"
        >
        <button
          v-if="inspectorUi.searchQuery"
          class="inspector-search-clear"
          type="button"
          aria-label="Очистить поиск"
          data-tooltip="Очистить поиск"
          data-testid="inspector-search-clear"
          @click="inspectorUi.searchQuery = ''"
        >
          <span class="visually-hidden">Очистить поиск</span>
        </button>
      </div>

      <div class="inspector-toolbar-actions">
        <button
          class="inspector-action-button icon-plus"
          type="button"
          aria-label="Добавить"
          data-tooltip="Добавить"
          data-testid="inspector-create"
          :disabled="inspectorActionPending('create')"
          @click="createInspectorObject"
        ><span class="visually-hidden">Добавить</span></button>

        <button
          class="inspector-action-button icon-copy"
          type="button"
          aria-label="Дублировать выбранный объект"
          data-tooltip="Дублировать выбранный объект"
          data-testid="inspector-duplicate-main"
          :disabled="inspectorActionPending('duplicate:' + inspectorTable.main_object)"
          @click="duplicateInspectorObject(inspectorTable.main_object)"
        ><span class="visually-hidden">Дублировать выбранный объект</span></button>

        <button
          class="inspector-action-button inspector-action-danger icon-trash"
          type="button"
          aria-label="Удалить выбранный объект"
          data-tooltip="Удалить выбранный объект"
          data-testid="inspector-delete-main"
          :disabled="inspectorActionPending('delete:' + inspectorTable.main_object)"
          @click="deleteInspectorObject(inspectorTable.main_object)"
        ><span class="visually-hidden">Удалить выбранный объект</span></button>

        <button
          v-if="inspectorHasHeaders"
          class="inspector-action-button icon-more-vertical"
          type="button"
          aria-label="Настроить столбцы"
          data-tooltip="Настроить столбцы"
          data-inspector-columns-toggle
          data-testid="inspector-columns-toggle"
          @click="toggleInspectorColumnsMenu"
        ><span class="visually-hidden">Настроить столбцы</span></button>

        <teleport to="body">
          <div
            v-if="inspectorUi.columnsMenuOpen"
            class="inspector-columns-menu"
            data-inspector-columns-menu
            data-testid="inspector-columns-menu"
            :style="inspectorUi.columnsMenuStyle"
          >
            <div class="inspector-columns-menu-title">Скрыть/показать</div>
            <button
              v-for="column in inspectorTable.columns"
              :key="column.id"
              class="inspector-columns-menu-item"
              type="button"
              :data-testid="'inspector-column-' + column.id"
              @click="toggleInspectorColumn(column.id, !inspectorUi.visibleColumnIds.includes(column.id))"
            >
              <span>{{ column.label }}</span>
              <span class="inspector-columns-menu-state" :class="{ visible: inspectorUi.visibleColumnIds.includes(column.id) }" aria-hidden="true"></span>
            </button>
          </div>
        </teleport>
      </div>
    </div>

    <div class="inspector-scroll">
      <div class="inspector-table" :class="{ 'inspector-headerless-list': !inspectorHasHeaders }">
        <div
          v-if="inspectorHasHeaders"
          class="inspector-row inspector-header"
          :style="inspectorGridStyle"
          role="row"
        >
          <div class="inspector-header-cell inspector-check-cell">
            <input
              class="inspector-checkbox"
              type="checkbox"
              aria-label="Выбрать все найденные объекты"
              data-testid="inspector-select-all"
              :checked="allFilteredInspectorRowsChecked"
              :disabled="filteredInspectorRows.length === 0 || inspectorActionPending('bulk-select')"
              @click.stop
              @change.stop="setFilteredInspectorObjectsSelected($event.target.checked)"
            >
          </div>
          <div class="inspector-header-cell inspector-name-cell">{{ inspectorTable.name_label }}</div>
          <div
            v-for="column in visibleInspectorColumns"
            :key="column.id"
            class="inspector-header-cell"
            :data-tooltip="column.tooltip || column.label"
          >{{ column.label }}</div>
        </div>

        <div
          v-for="row in filteredInspectorRows"
          :key="row.id"
          class="inspector-row inspector-item"
          :class="{ selected: String(row.id) === String(inspectorTable.main_object) }"
          :style="inspectorGridStyle"
          role="row"
          :data-testid="'inspector-row-' + row.id"
          @click="setMainInspectorObject(row.id)"
        >
          <div class="inspector-cell inspector-check-cell">
            <input
              class="inspector-checkbox"
              type="checkbox"
              :aria-label="'Выбрать ' + row.name"
              :data-testid="'inspector-select-' + row.id"
              :checked="isInspectorRowChecked(row.id)"
              :disabled="inspectorActionPending('select:' + row.id)"
              @click.stop
              @change.stop="setInspectorObjectSelected(row.id, $event.target.checked)"
            >
          </div>

          <div
            class="inspector-cell inspector-name-cell"
            :class="{ 'inspector-actions-host': visibleInspectorColumns.length === 0 }"
            :data-tooltip="row.name"
          >
            <span class="inspector-name">{{ row.name }}</span>
            <div v-if="visibleInspectorColumns.length === 0" class="inspector-row-actions">
              <button class="inspector-row-action icon-copy" type="button" aria-label="Дублировать" data-tooltip="Дублировать" :data-testid="'inspector-duplicate-' + row.id" :disabled="inspectorActionPending('duplicate:' + row.id)" @click.stop="duplicateInspectorObject(row.id)"><span class="visually-hidden">Дублировать</span></button>
              <button class="inspector-row-action inspector-action-danger icon-trash" type="button" aria-label="Удалить" data-tooltip="Удалить" :data-testid="'inspector-delete-' + row.id" :disabled="inspectorActionPending('delete:' + row.id)" @click.stop="deleteInspectorObject(row.id)"><span class="visually-hidden">Удалить</span></button>
            </div>
          </div>

          <div
            v-for="(column, columnIndex) in visibleInspectorColumns"
            :key="column.id"
            class="inspector-cell"
            :class="{ 'inspector-actions-host': columnIndex === visibleInspectorColumns.length - 1 }"
            :data-tooltip="inspectorCellTooltip(row, column)"
          >
            <span class="inspector-cell-value">{{ inspectorCellValue(row, column) }}</span>
            <div v-if="columnIndex === visibleInspectorColumns.length - 1" class="inspector-row-actions">
              <button class="inspector-row-action icon-copy" type="button" aria-label="Дублировать" data-tooltip="Дублировать" :data-testid="'inspector-duplicate-' + row.id" :disabled="inspectorActionPending('duplicate:' + row.id)" @click.stop="duplicateInspectorObject(row.id)"><span class="visually-hidden">Дублировать</span></button>
              <button class="inspector-row-action inspector-action-danger icon-trash" type="button" aria-label="Удалить" data-tooltip="Удалить" :data-testid="'inspector-delete-' + row.id" :disabled="inspectorActionPending('delete:' + row.id)" @click.stop="deleteInspectorObject(row.id)"><span class="visually-hidden">Удалить</span></button>
            </div>
          </div>
        </div>

        <div v-if="inspectorUi.searchQuery && filteredInspectorRows.length === 0" class="inspector-filter-empty" data-testid="inspector-empty">
          Таких элементов не найдено
        </div>
      </div>
    </div>
  </div>
</section>
