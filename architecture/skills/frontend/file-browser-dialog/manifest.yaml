schema_version: 1
name: file-browser-dialog
version: 2.0.0
title: "File Browser Dialog"
description: >
  Техническая реализация server-side file browser: directory и single-file
  modes, root boundary, structured entries, request guards, targets и dialog
  lifecycle по готовому Designer contract.
language: ru
audience: [assistant]
priority: 0.85
when-to-use:
  - "Нужно выбрать server-side директорию или файл"
  - "File browser должен открыться поверх save/import dialog"
  - "Нужна навигация по backend root с фильтром расширений"
when-not:
  - "Нужен native browser file input или upload"
  - "Нужны rename, delete, create directory или multi-select"
requires-tools: []
requires-products: []
reference-files:
  - "reference/template.js"
