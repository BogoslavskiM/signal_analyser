schema_version: 1
name: design-implementation
version: 3.1.0
title: "Design Implementation Frontend"
description: >
  Проверяет и реализует pinned Designer package в production HTML/CSS/assets,
  переносит local Roboto/SVG, canonical colors/menus/proportions, формирует
  design_revision при gap и точно реализует source-derived profile,
  dimensions/radii/states, Designer-owned page sizing contract и pinned design
  version.
language: ru
audience: [assistant]
priority: 0.95
when-to-use:
  - "После zone/API implementation для UI-affecting frontend task"
  - "Нужно проверить или применить design_ref и design_version"
when-not:
  - "Задача не изменяет и не затрагивает видимый UI"
requires-tools: []
requires-products: []
reference-files: []
