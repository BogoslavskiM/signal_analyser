schema_version: 1
name: settings-controls
version: 3.1.0
title: "Settings Controls"
description: >
  Техническая реализация typed scalar settings controls: drafts, parsing,
  150 ms batching, state-revision guard, trailing-decimal drafts, canonical
  settings menus, searchable enum open/not-active lifecycle, outside-click
  closing, validation mapping and Apply lifecycle по Designer contract.
language: ru
audience: [assistant]
priority: 0.9
when-to-use:
  - "Нужно реализовать панель настроек Genie-приложения"
  - "Нужно создать типизированный scalar control по backend metadata"
  - "Нужно отобразить validation error или warning поля"
when-not:
  - "Нужно реализовать массив или другой составной control"
  - "Нужно реализовать backend settings state"
requires-tools: []
requires-products: []
reference-files:
  - "reference/template.js"
