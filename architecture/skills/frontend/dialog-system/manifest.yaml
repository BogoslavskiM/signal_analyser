schema_version: 1
name: dialog-system
version: 3.0.0
title: "Dialog System"
description: >
  Техническая реализация modal lifecycle: base component, explicit close,
  focus, busy/form/error/success state, semantic overlay stacking и recovery по
  готовому Designer contract.
language: ru
audience: [assistant]
priority: 0.9
when-to-use:
  - "Нужно добавить form, error или success dialog"
  - "Нужен общий modal template и stacking file browser/error"
  - "Нужно сохранить form state при ошибке API"
when-not:
  - "Нужно показать field validation или calculation error"
  - "Нужно реализовать backend import/export"
requires-tools: []
requires-products: []
reference-files:
  - "reference/template.js"
