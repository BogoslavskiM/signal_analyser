schema_version: 1
name: graph-output-zone
version: 3.1.0
title: "Graph Output Zone"
description: >
  Техническая реализация быстрой Plotly-зоны: Julia-prepared payload, lazy
  local Plotly, canonical white/grey modebar, latest-only rAF rendering,
  deferred resize и revision guards.
language: ru
audience: [assistant]
priority: 0.9
when-to-use:
  - "Нужно реализовать расчётную страницу с одним или несколькими Plotly-графиками"
  - "Нужны preloader, calculation error и controls под графиками"
  - "Нужно связать graph page с inspector selection и backend Plotly payload"
when-not:
  - "Нужно реализовать backend-расчёты или очередь"
  - "Страница не содержит графики"
requires-tools: []
requires-products: []
reference-files:
  - "reference/template.js"
