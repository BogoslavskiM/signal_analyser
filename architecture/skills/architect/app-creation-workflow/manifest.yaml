schema_version: 1
name: app-creation-workflow
version: 1.5.0
title: "App Creation Workflow"
description: >
  Верхнеуровневый workflow архитектора для создания типового Genie-приложения
  группой агентов: DevOps task branch, параллельный MATLAB Researcher,
  blueprint, раскладка, зоны, handoff backend/frontend/tester, application
  toolbar, optional object export, единая система стилей и merge принятой задачи,
  интеграционная проверка и следующий цикл задач.
language: ru
audience: [assistant]
priority: 0.9
when-to-use:
  - "Нужно спланировать создание типового приложения с нуля"
  - "Нужно разложить работу между архитектором, backend, frontend, tester, e2e, DevOps и MATLAB Researcher"
  - "Нужно определить последовательность этапов: раскладка, зоны, state, API, tests, apply, стилизация"
  - "Нужно определить следующие шаги после создания приложения: e2e, handoff, интеграционные проверки"
when-not:
  - "Нужно реализовать конкретную backend-функцию — используйте backend skills"
  - "Нужно сверстать конкретную зону — используйте frontend skills"
requires-tools: []
requires-products: []
reference-files: []
extends: null
