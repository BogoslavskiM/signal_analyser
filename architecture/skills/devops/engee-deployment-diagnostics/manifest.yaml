schema_version: 1
name: engee-deployment-diagnostics
version: 1.3.0
title: "Engee Deployment Diagnostics"
description: >
  DevOps subskill для получения и безопасного сохранения Engee application
  logs, диагностики failed pod/deploy/start/readiness и technical-work screen,
  evidence-based классификации backend/frontend/DevOps/undetermined, узкого
  routing конкретных Engee function/package contracts, package recovery и
  формирования handoff со ссылками evidence.
language: ru
audience: [assistant]
priority: 1
when-to-use:
  - "Deploy, engee.genie.start или readiness завершились ошибкой"
  - "engee_status/engee_start не подтвердили ready production pod"
  - "В production browser открылся экран технических работ или generic maintenance page"
  - "Получен devops_request: get_logs"
  - "Orchestrator запросил runtime evidence для точной Engee revision"
when-not:
  - "Deploy успешен и отдельный запрос логов отсутствует"
  - "Для исправления product code, E2E tests или Engee contract вместо владельца"
requires-tools:
  - "Production Engee pod status and start tools"
  - "Production Engee shell or equivalent command execution"
requires-products:
  - "Engee"
reference-files:
  - "reference/SUMMARY.template.md"
