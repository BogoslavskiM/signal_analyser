schema_version: 1
name: devops-workflow
version: 7.3.0
title: "DevOps Workflow"
description: >
  Единый автономный pipeline для clone-repo, new-feature-branch, deploy,
  automatic-gate merge, get-logs и runtime restart: explicit pod lifecycle gate,
  обязательный remote-only cleanup dirty
  checkout через git add/stash, Git/Engee update, Engee-only application start,
  failed-deploy diagnostics и package-environment recovery с TOML sync.
language: ru
audience: [assistant]
priority: 1
when-to-use:
  - "Получен любой DevOps handoff: clone_repo, new_feature_branch, deploy, merge_feature, get_logs, restart_application или restart_engee"
when-not:
  - "Для редактирования product, test, configuration или architecture files"
requires-tools:
  - "Git"
  - "Production Engee pod status, start and stop tools"
  - "Production Engee Julia execution for application start"
  - "Production Engee shell or equivalent command execution"
  - "Production Engee typed file listing and download"
requires-products: []
reference-files: []
