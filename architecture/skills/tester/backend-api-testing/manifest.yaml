schema_version: 1
name: backend-api-testing
version: 3.0.0
title: "Backend API Testing"
description: >
  Tester skill для Genie API: точный ordered route contract без локального
  server, прямые tests именованных handlers, field-by-field payload assertions,
  state-lite/revisions, active-only plot cache/pending, validation/programmer
  errors, confirmed-Engee unavailable stub и endpoint coverage report.
language: ru
audience: [assistant]
priority: 0.9
when-to-use:
  - "Нужно создать или изменить backend API tests"
  - "Нужно проверить route registration, handler payload или state mutation"
when-not:
  - "Нужно проверить чистую domain-функцию или браузерный workflow"
  - "Нужно проверить Engee function contract"
requires-tools: []
requires-products:
  - "Julia"
  - "Genie"
reference-files:
  - "reference/api-test-template.jl"
  - "reference/report-template.md"
