workflow = ["bootstrap optional ai_manager product-question channel", "user intake and UI-impact classification", "start or extend background MATLAB research lane", "dispatch Engee User contract lane for every Engee-dependent scope", "backlogging", "request DevOps clone_repo when the production Engee apps checkout is absent", "open every new major feature cycle through DevOps new_feature_branch", "select model and reasoning", "get next queued task", "dispatch Designer, MATLAB Researcher and Engee User in parallel", "resolve any subagent ambiguity with one relevant skill then the product-question gate", "wait for the Engee contract report before dispatching dependent Backend", "route a confirmed Engee bug to explicit Backend stub, visible Frontend unavailable state and blocked recovery task", "review Designer clickable prototype, assets, proportions, page sizing contract and package completeness", "dispatch Backend with active-page performance contracts when outputs are heavy", "dispatch Frontend with pinned design, prototype map, page sizing and overlay priority contracts", "record and route design revisions", "review implementation and verification reports", "request DevOps deploy with explicit production pod readiness and Engee-only application start", "request DevOps restart_application or restart_engee when system/runtime recovery is needed without a deploy", "allow DevOps to run one package-environment recovery and post-readiness TOML sync inside the same deploy request", "persist and route DevOps deployment-failure and technical-maintenance-screen diagnostics to the evidence-based owner", "dispatch quick or new-functionality E2E with exact runtime, design prototype and revision", "require E2E to click the local design before production", "require E2E to verify page sizing and close only its own Chrome tabs in finally", "require overlay-stack hit-testing and focus verification when overlays coexist", "close or create follow-up work", "evaluate the automatic integration gate and merge passing features to neuro_dev through DevOps without user approval", "generate human-readable user report", "backlogging", "dispatch analysis E2E when actionable backlog becomes empty", "next development cycle"]
