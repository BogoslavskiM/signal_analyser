schema_version = "2"
source_of_truth = "architecture/agents"
strict_boundaries = true

required_project_layout = [
  "architecture/README.md",
  "architecture/agents/manifest.toml",
  "architecture/agents/roles/*.toml",
  "architecture/tasks/**",
  "architecture/handoffs/**",
  "architecture/design/**",
  "architecture/backend_documentation/**",
  "architecture/frontend_documentation/**",
  "architecture/engee_bugs/**",
  "architecture/logs/**",
  "architecture/skills/**",
  "app/**",
  "lib/**",
  "public/**",
  "test/**",
]

verification_commands = [
  "julia --startup-file=no -e 'for file in ARGS; Meta.parseall(read(file, String)); println(file); end' <files>",
  "julia --project=. test/back/runtests.jl",
  "julia --startup-file=no test/engee/engee_package_contract_tests.jl",
  "node test/front/run_front_tests.js",
  "./test/playwright/run_playwright_tests.js",
]

[workflow]
lead_role = "orchestrator"
development_mode = "autonomous"
product_question_policy = "one-relevant-skill-then-ai-manager-or-mode-fallback"
reporting = "chat-first"
task_order = "orchestrator-decides-sequential-or-parallel"
handoff_policy = "handoff-instead-of-crossing-boundaries"
documentation_owner = "orchestrator"
archive_paths = ["architecture_0/", "architecture_1/"]
post_task_e2e = "quick_or_new_functionality_regression"
idle_e2e = "analysis_regression"
quick_regression_success_threshold_percent = 75
deployment_owner = "devops"
pod_lifecycle_owner = "devops"
pod_start_gate = "engee_status-then-engee_start-until-ready"
devops_pod_task_lock = "mcp_devops_genie_is_bysy-poll-20s-release-immediately-after-last-task-command-before-report"
devops_pod_dirty_worktree_policy = "production-engee-only-exact-checkout-git-add-dot-then-git-stash-verify-clean-never-auto-restore"
runtime_restart_owner = "devops"
runtime_restart_requests = ["restart_application", "restart_engee"]
deployment_failure_owner_classification = "devops-evidence-based-routing"
maintenance_screen_diagnostics = "http-status-plus-pod-start-readiness-logs"
deployment_failure_logs = "architecture/logs/LOG-XXXX-<deploy-slug>"
package_environment_owner = "devops-conditional-recovery-only"
engee_environment_sync = "post-readiness-project-and-manifest-pair"
application_runtime = "engee-production-only"
local_application_start_allowed = false
initial_engee_checkout = "devops_clone_repo_to_user_apps_with_protected_pat"
background_matlab_research = "immediate_non_blocking_single_lane"
engee_contract_stage = "immediate_parallel_pre_backend_gate"
matlab_scenario_source = "matlab_clicker_saved_catalog"
critical_scenario_verdict_scope = "matlab_reference_scenario_catalog"
design_owner = "designer"
design_gate = "ui-impact-and-versioned-design-package"
design_source_priority = ["task-specification", "architecture-templates", "corporate-figma", "designer-decision"]
design_prototype_gate = "fully-clickable-and-e2e-read-before-production"
design_reference_assets = "local-roboto-svg-and-application-screenshot-catalogs"
design_geometry_contract = "source-derived-analytical-dense-or-form-workbench-profile"
design_page_sizing_contract = "designer-owned-minima-invariant-layout-proportional-unlimited-growth-document-scroll"
data_heavy_ui_contract = "julia-dsp-state-lite-active-page-cache-revisions-lazy-plotly"
e2e_browser_visibility = "foreground-google-chrome-headless-false-single-worker"
e2e_browser_tab_cleanup = "finally-close-run-created-tabs-preserve-pre-existing-user-tabs-and-shared-browser"

[git_workflow]
remote = "origin"
autonomous_development_branch = "neuro_dev"
feature_base_branch = "neuro_dev"
feature_branch_pattern = "neuro_<feature_slug>"
integration_merge_target = "neuro_dev"
integration_merge_strategy = "squash"
integration_gate_owner = "orchestrator"
integration_gate_mode = "automatic-technical-no-user-approval"
delete_feature_branch_after_merge = false

[model_selection]
high_reasoning_effort = "xhigh"
medium_reasoning_effort = "medium"
low_reasoning_effort = "low"

[engee_target]
selection_policy = "project-locked"
environment = "prod"
base_url = "https://engee.com"
mcp_server = "prod"
pod_status_api = "engee_status"
pod_start_api = "engee_start"
pod_stop_api = "engee_stop"
pod_start_blocks_until_ready = true
explicit_pod_gate_required = true
explicit_pod_restart_request = "restart_engee"
allow_devhub = false
allow_fallback = false
credential_source = "protected root AGENTS instructions"
application_start_api = "engee.genie.start"
application_start_signature = "engee.genie.start(<app_path>, log_file=<log_file>)"
application_start_example = "engee.genie.start(\"/path/app.jl\", log_file=\"/path/app_log.log\")"
package_instantiate_api = "geniepkg_instantiate"
project_environment_files = ["Project.toml", "Manifest.toml"]
project_environment_sync_gate = "successful-application-start-and-readiness"
allow_relative_application_path = true
allow_local_application_start = false

[[roles]]
name = "orchestrator"
file = "architecture/agents/roles/orchestrator.toml"
owns = ["architecture/**", "docs/**", "AGENTS.md", ".codex/**", "README.md"]

[[roles]]
name = "backender"
file = "architecture/agents/roles/backender.toml"
owns = ["app/**", "lib/**", "app.jl", "run.jl", "config/**"]

[[roles]]
name = "designer"
file = "architecture/agents/roles/designer.toml"
owns = ["architecture/design/**"]

[[roles]]
name = "frontend"
file = "architecture/agents/roles/frontend.toml"
owns = ["public/**"]

[[roles]]
name = "tester"
file = "architecture/agents/roles/tester.toml"
owns = ["test/back/**", "test/front/**"]

[[roles]]
name = "matlab_researcher"
file = "architecture/agents/roles/matlab-researcher.toml"
owns = []

[[roles]]
name = "engee_user"
file = "architecture/agents/roles/engee-user.toml"
owns = ["test/engee/**", "architecture/engee_bugs/**"]

[[roles]]
name = "e2e"
file = "architecture/agents/roles/e2e.toml"
owns = ["test/playwright/**"]

[[roles]]
name = "devops"
file = "architecture/agents/roles/devops.toml"
owns = ["architecture/logs/**", "Project.toml", "Manifest.toml"]
