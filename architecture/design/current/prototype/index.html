<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Analyser design review</title>
  <link rel="stylesheet" href="../frontend-source/css/theme.css">
  <link rel="stylesheet" href="../frontend-source/css/app-shell.css">
  <link rel="stylesheet" href="../frontend-source/css/components/value-select.css">
  <link rel="stylesheet" href="../frontend-source/css/zones/toolbar/style.css">
  <link rel="stylesheet" href="../frontend-source/css/zones/workspace/style.css">
  <link rel="stylesheet" href="../frontend-source/css/zones/settings/style.css">
  <link rel="stylesheet" href="../frontend-source/css/zones/inspector/style.css">
  <link rel="stylesheet" href="../frontend-source/css/dialogs/signal-operation.css">
</head>
<body>
  <main id="app" class="app-shell" data-testid="app-shell" aria-label="Анализатор сигналов">
    <div data-zone-slot="toolbar"></div>
    <div class="workspace-inspector-stack" data-testid="workspace-inspector-stack">
      <section class="main-stage" aria-label="Рабочая область и настройки">
        <div data-zone-slot="workspace"></div>
        <div data-zone-slot="settings"></div>
      </section>
      <div class="workspace-inspector-splitter" aria-hidden="true"></div>
      <div data-zone-slot="inspector"></div>
    </div>
    <div data-dialog-slot="signal-operation"></div>
  </main>
  <div id="value-select-popup" class="value-select-popup" data-value-select-popup data-testid="select-menu" hidden></div>
  <script>window.SignalAnalyserUIDesign = { assetBase: "../frontend-source" };</script>
  <script src="../mock/mock-provider.js"></script>
  <script src="../frontend-source/js/ui/loader.js"></script>
</body>
</html>
