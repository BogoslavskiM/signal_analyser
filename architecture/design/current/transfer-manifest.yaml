schema_version: 2
design_version: 32
visual_baseline_version: 28
source_root: frontend-source
target_root: public
transfer_mode: additive_integration_only
ui_contract: ui-contract.yaml

prototype_baseline:
  entry: prototype/index.html
  protocol: file
  structure_snapshot_of: public/index.html
  local_server_required: false
  network_requests_allowed: false
  provider_fixture: prototype/mock-fetch.js
  provider_fixture_scope: data_and_api_responses_only
  interaction_fixture: [prototype/task-0117-interaction-bridge.js, prototype/task-0119-interaction-bridge.js]
  interaction_fixture_scope: "design-only adapters proving row/checkbox separation plus automatic samples, pane-type routing and Jet color draft against actual production DOM/API modules"
  production_sources_rendered_in_place: [public/css/theme.css, public/css/app.css, public/js/api.js, public/js/value-select.js, public/js/numeric.js, public/js/settings.js, public/js/layouts.js, public/vendor/vue/3.5.41/vue.global.prod.js, public/js/components/explicit-apply.js, public/js/native-session-io.js, public/js/app.js]
  pinned_hashes: evidence/production-baseline-v32.json
  walkthrough: [evidence/interaction-walkthrough-v31-standalone.json, evidence/interaction-walkthrough-v32-standalone.json]
  result: "Inherited 26/26 plus v32 delta 9/9; automatic populated five-column samples, Jet picker, context routing, spectrum extrema and spectrogram hiding; zero HTTP/CORS/runtime errors"

# There is intentionally no whole-file production copy in v32. Production
# already owns the application document, boot sequence, UI modules and Plotly
# hosts. The sources below are exact integration fragments.
copy_as_is: []

production_invariants:
  - path: public/index.html
    policy: immutable
    reason: "Existing application shell, script order, static tabs, pane menu and overlay roots stay authoritative."
  - path: public/js/app.js
    policy: extend_in_place_never_replace
    preserve: [bootstrap, model_lifecycle, existing_renderers, Plotly_queue, event_delegation]
  - path: public/js/settings.js
    policy: extend_in_place_never_replace
    preserve: [settings_document_lifecycle, draft_revision, validation, unified_apply]
  - path: public/js/api.js
    policy: extend_in_place_never_replace
    preserve: [request_transport, error_projection, existing_exports]
  - path: public/js/value-select.js
    policy: reuse_unchanged
    reason: "Operation uses the existing production SignalAnalyserValueSelect; design copy is mock-only."
  - selector: "[data-pane-host]"
    owner: "public/js/app.js + Plotly"
    policy: never_replace_or_overwrite_dom
    allowed: ["Plotly.react using the existing queue", "Plotly.relayout", "existing amplitude-slider overlay path"]

additive_fragments:
  - id: task-0112-0115-feature-styles
    source: integration/css/task-0112-0115-additions.css
    target: public/css/app.css
    mode: append_once
    content_changes_allowed: false
    marker: "Additive v29 feature rules"
    scope: [signal_summary, signal_samples_table, spectrum_extrema_cell, signal_operation_dialog, operation_overwrite_checkbox_label]
  - id: task-0116-signal-row-state
    source: integration/css/task-0116-refinements.css
    target: public/css/app.css
    mode: replace_matching_selector_bodies
    content_changes_allowed: false
    remove_obsolete_selectors: [".signal-table tbody tr.is-selected", ".signal-table tbody tr.is-selected .color-cell"]
    marker: "V30 TASK-0116 final selector replacements"
    scope: [main_signal_row_fill, ordinary_row_hover, color_cell_main_signal_only]
  - id: signal-operation-modal-template
    source: integration/html/dialogs/signal-operation.fragment.html
    target: public/js/app.js
    mode: integrate_markup_unchanged_as_runtime_singleton
    portal: document.body
    singleton_selector: "[data-testid='signal-operation-layer']"
    content_changes_allowed: false
  - id: task-0117-signal-row-intent
    source: integration/js/task-0117-signal-row-intent.js
    target: public/js/app.js
    mode: integrate_functions_unchanged_into_existing_event_delegation
    content_changes_allowed: false
    marker: "TASK-0117 independent row/main and checkbox/visibility intents"
    scope: [row_surface_click, direct_visibility_checkbox]
    prototype_bridge_not_transferable: prototype/task-0117-interaction-bridge.js
  - id: task-0118-signal-color-picker-styles
    source: integration/css/task-0118-color-picker.css
    target: public/css/app.css
    mode: append_once
    content_changes_allowed: false
    marker: "TASK-0118 compact Signal color picker with explicit Jet palette"
    scope: [anchored_popover, hex, fifteen_jet_swatches, selected_tick, draft_footer]
  - id: task-0118-signal-color-picker-ui
    source: integration/js/task-0118-color-picker.js
    target: public/js/app.js
    mode: integrate_ui_module_unchanged_into_existing_boot
    content_changes_allowed: false
    marker: "TASK-0118 nested Signal color draft"
    scope: [open_position, hex_validation, jet_selection, cancel_restore, apply_to_page_draft]
  - id: task-0119-context-and-samples-intent
    source: integration/js/task-0119-context-and-samples-intent.js
    target: public/js/app.js
    mode: integrate_functions_unchanged_into_existing_pane_and_samples_lifecycle
    content_changes_allowed: false
    marker: "TASK-0119 Area routing, automatic main-signal sample tab and sample-rate validation"
    scope: [pane_type_to_area, automatic_sample_tab, values_focus_only, positive_dot_decimal_sample_rate]
    prototype_bridge_not_transferable: prototype/task-0119-interaction-bridge.js

existing_assets_reused:
  - {path: public/icons/function.svg, use: signal-row-operation-action}
  - {path: public/icons/close.svg, use: signal-operation-close}
  - {path: public/icons/Spinner.svg, use: signal-operation-busy}
  - {path: public/icons/chevron-down-fill-16.svg, use: SignalAnalyserValueSelect}
  - {path: public/icons/tick-figma.svg, use: pane-menu-checked-state}
  - {path: public/icons/tick-figma.svg, use: selected-Jet-swatch}

integration_hosts:
  settings_tabs:
    selector: "[data-testid='settings-tabs']"
    integration: "public/js/app.js ensures one Signal tab immediately before [data-settings-page='display']; do not replace tablist."
  settings_content:
    selector: "[data-settings-content][data-testid='settings-content']"
    integration: "public/js/app.js and public/js/settings.js render only the active page into the existing content owner."
  settings_apply:
    selector: "[data-testid='settings-footer'] [data-testid='settings-apply']"
    integration: "All Signal/Area/Screen/Extrema drafts use the existing unified Apply lifecycle; no second footer or action."
  inspector_tabs:
    selector: ".inspector-tabs"
    integration: "public/js/app.js automatically ensures/rebinds one sample tab keyed by stable main-signal id and preloads page 1; Values only selects/focuses it."
  inspector_body:
    selector: "[data-inspector-content]"
    integration: "Existing renderInspector page switch renders samples or spectrum extrema into this body; do not replace the inspector shell."
  inspector_rows:
    selector: "[data-signal-rows]"
    integration: "Existing signals renderer keeps checkbox membership distinct from one [data-main-signal=true].is-main-signal row. Plain row LMB excludes controls/actions, ensures membership ON and selects main; direct checkbox changes membership only. Both use the existing revision flow."
  signal_settings_groups:
    selector: "[data-signal-settings-group]"
    integration: "Reuse existing .settings-group-title/.settings-group-fields disclosure; main and summary start expanded and are independently collapsible."
  workspace_context:
    selector: "[data-pane-id], [data-display-select], [data-testid='add-display'], [data-value-select-key$='::plot_type']"
    integration: "Pane click and accepted pane-type change select Area settings; display selection/creation selects Screen settings without remounting shell or settings panel."
  signal_color:
    selector: ".settings-panel .color-swatch-button, [data-signal-metadata='color']"
    integration: "One fixed 284px Jet popover is appended to body; its Apply writes only the existing Signal metadata draft and dispatches the existing input lifecycle."
  pane_menu:
    selector: "[data-testid='display-overflow-menu']"
    integration: "Reuse [data-plot-range-slider] for time/frequency and [data-plot-amplitude-slider] for amplitude/magnitude; labels and aria state project the active pane type."
  plot_host:
    selector: "[data-pane-host]"
    integration: "Projected spectrum-extrema marker traces and slider layout go through the existing Plotly render/relayout queue; never set innerHTML or replaceChildren on the host."
  modal_portal:
    selector: body
    integration: "Append the signal-operation singleton on first use; reuse existing [data-value-select-popup] and modal stacking."

integration_seams:
  - id: signal-membership-main
    action_interface: "row click => ensure active-pane membership ON then select that signal as main; direct checkbox => set active-pane membership only and never change main"
    production_consumers: [public/js/app.js]
    production_providers: [public/js/api.js]
    hosts: ["[data-signal-rows]", "[data-settings-content]"]
    state_separation: {checkbox: pane_membership_only, blue_row: main_signal_only, hidden_main_allowed: true}
    replacement_forbidden: true
  - id: signal-settings-disclosure
    action_interface: "render and toggle Signal Основное/Сводка through the existing settings-group disclosure contract; exact field label Дискретизация, Гц"
    production_consumers: [public/js/app.js]
    host: "[data-settings-content]"
    replacement_forbidden: true
  - id: signal-color-draft
    action_interface: "open HEX + exact 15 Jet swatches; preview nested draft; popover Apply updates Signal page draft; Cancel/Escape/outside restore opening color"
    production_consumers: [public/js/app.js]
    host: "document.body + [data-settings-content]"
    direct_api_call_forbidden: true
    replacement_forbidden: true
  - id: settings-context-routing
    action_interface: "pane click or accepted pane-type mutation -> Area settings; display-tab/add-display click -> Screen settings"
    production_consumers: [public/js/app.js]
    hosts: ["[data-pane-id]", "[data-display-select]", "[data-testid='add-display']", "[data-settings-page]"]
    replacement_forbidden: true
  - id: automatic-main-signal-samples
    action_interface: "valid main signal => ensure/rebind named sample tab and request first page without focus; Values => select/focus the same tab"
    production_consumers: [public/js/app.js]
    production_providers: [public/js/api.js]
    hosts: [".inspector-tabs", "[data-inspector-content]"]
    full_array_in_dom_or_state_forbidden: true
    replacement_forbidden: true
  - id: signal-sample-rate-draft
    action_interface: "editable Дискретизация, Гц metadata; positive finite dot-decimal UI validation; shared Apply persistence"
    production_consumers: [public/js/app.js]
    production_providers: [public/js/api.js]
    host: "[data-settings-content]"
    replacement_forbidden: true
  - id: settings-page-extension
    action_interface: "ensure signal tab; render Signal/Area/Screen/Extrema into existing settings content"
    production_consumers: [public/js/app.js, public/js/settings.js]
    hosts: ["[data-testid='settings-tabs']", "[data-settings-content]", "[data-testid='settings-apply']"]
    replacement_forbidden: true
  - id: pane-slider-visibility
    action_interface: "get/set active pane x/y slider visibility from pane menu or settings checkbox; synchronously project both controls from one draft"
    production_consumers: [public/js/app.js, public/js/settings.js]
    hosts: ["[data-plot-range-slider]", "[data-plot-amplitude-slider]", "[data-settings-content]", "[data-pane-host]"]
    replacement_forbidden: true
  - id: projected-spectrum-extrema
    provider_interface: "read projected spectrum extrema for active display/pane/signal and expose ready/loading/error rows plus marker coordinates"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    hosts: ["[data-pane-host]", "[data-inspector-content]"]
    ui_does_no_dsp_or_unit_projection: true
  - id: signal-summary-provider
    provider_interface: "read main-signal metadata and summary for the active pane"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    host: "[data-settings-content]"
  - id: signal-samples-pagination
    provider_interface: "get page by stable signal id, cursor and limit; return rows, next cursor and total"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    hosts: [".inspector-tabs", "[data-inspector-content]"]
    full_array_in_dom_or_app_state_forbidden: true
  - id: signal-operation-provider
    provider_interface: "submit {operation, source, body, target_name, overwrite, multiplier}; backend owns Engee recv envelope/temp binding/cleanup"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    portal: body
  - id: stable-name-state
    provider_interface: "persist display/pane names by stable ids and allocate monotonic default ordinals"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js

design_only:
  - frontend-source/index.html
  - frontend-source/css/theme.css
  - frontend-source/css/app-shell.css
  - frontend-source/css/components/**
  - frontend-source/css/dialogs/**
  - frontend-source/css/fonts/**
  - frontend-source/css/zones/**
  - frontend-source/html/dialogs/**
  - frontend-source/html/zones/**
  - frontend-source/icons/**
  - frontend-source/js/**
  - mock/**
  - prototype/**
  - screenshots/**
  - evidence/**
  - DESIGN.md
  - ui-contract.yaml
  - transfer-manifest.yaml

forbidden_transfers:
  - {source: frontend-source/index.html, target: public/index.html, reason: immutable_production_document}
  - {source: frontend-source/js/ui/app.js, target: public/js/app.js, reason: mock_renderer_must_not_replace_production_module}
  - {source: frontend-source/js/ui/zones/workspace/ui.js, target: public/js/app.js, reason: mock_svg_plot_must_not_replace_Plotly}
  - {source: frontend-source/js/ui/components/value-select.js, target: public/js/value-select.js, reason: production_component_already_exists}
  - {source: frontend-source/css/theme.css, target: public/css/theme.css, reason: production_theme_is_authoritative}

invariants:
  additive_only: true
  immutable_production_document: true
  immutable_shell_composition: true
  existing_module_identity_preserved: true
  existing_plot_host_identity_preserved: true
  plot_host_dom_overwrite_forbidden: true
  mock_shell_transfer_forbidden: true
  mock_provider_transfer_forbidden: true
  copied_fragment_content_changes_allowed: false
  visual_baseline_unchanged: true
  mock_owns_ui_behavior: false
  mock_scope_is_data_provider_only: true
  prototype_task0117_bridge_transfer_forbidden: true
  prototype_task0119_bridge_transfer_forbidden: true
  history_is_not_a_source: true
  prototype_uses_production_shell_and_components: true
  prototype_partial_fetch_loader_forbidden: true
