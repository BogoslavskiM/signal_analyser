    overlay_selector: ".app-status"
    shell_selector: "[data-testid='app-shell']"
    integration: "Keep one mounted status host. Begin before initial state-lite; accept only current-token state-lite with signals/displays/layout and current active-display settings; close after the matching first render commits. Required failure/20s timeout stays blocking with sanitized Retry. Pane outputs and secondary data are excluded. Cursor remains standard."
  synchronized_ranges:
    settings_selector: "[data-settings-content] [data-settings-group$='ranges'], [data-settings-content] [data-screen-settings-group='ranges']"
    plot_selector: "[data-pane-host]"
    integration: "One active/clicked pane viewport projects between Plotly, in-plot sliders and Area/Screen fields/handles. pointerdown/keyboard begin captures stable nodes; input/relayouting previews in place; pointerup/change/keyboard commit or relayout settles once after 150ms in frontend state only. No settings/API/output/DSP/revision/session lifecycle exists for these values; enabled persisted link flags propagate frontend relayout only."
  measurement_cursor_columns:
    selector: "[data-testid='measurement-table'], [data-testid='measurement-columns-menu']"
    integration: "Append six cursor rows to the existing vertical-three-dot eye menu and eligible columns to the existing table; subscribe to the active pane cursor snapshot. Effective visibility is latent pane intent AND current off/single/dual eligibility."
  axis_labels_and_hover:
    selector: "[data-setting-id='display.show_axis_labels'], [data-pane-host]"
    integration: "Insert the persisted per-pane checkbox immediately after the legend checkbox; relayout/restyle only title text. Normalize every accepted Plotly payload and overlay trace to hovermode=false, hoverinfo=skip and hovertemplate=null."
  cursor_trim_signal:
    selector: "[data-testid='pane-trim-signal'], [data-testid='signal-trim-layer']"
    integration: "Subscribe to the current Time pane dual-cursor/main-signal context, insert the existing compact icon-button before plot type/overflow only while eligible, and use one body-portal modal through the revision-safe signal mutation queue."
  settings_tabs:
    selector: "[data-testid='settings-tabs']"
    integration: "public/js/app.js ensures one Signal tab immediately before [data-settings-page='display']; do not replace tablist."
  settings_content:
    selector: "[data-settings-content][data-testid='settings-content']"
    integration: "public/js/app.js and public/js/settings.js render only the active page into the existing content owner."
  settings_autosave:
    selector: "[data-settings-content], [data-testid='settings-footer']"
    integration: "Signal/Area/Screen changes autosave through one revision-safe queue; the contextual footer shows Значения for Signal and Рассчитать for Extrema."
  inspector_tabs:
    selector: ".inspector-tabs"
    integration: "public/js/app.js automatically ensures/rebinds one sample tab keyed by stable main-signal id and preloads page 1; Values only selects/focuses it."
  inspector_body:
    selector: "[data-inspector-content]"
    integration: "Existing renderInspector page switch renders samples or spectrum extrema into this body; do not replace the inspector shell."
  sample_columns_menu:
    trigger_selector: "[data-testid='inspector-pane-samples'] .samples-point-search-row [data-testid='sample-columns-menu-trigger']"
    portal_selector: "body > [data-testid='sample-columns-menu']"
    integration: "Remove the obsolete standalone point-search action, reuse one standard inspector-action three-dot trigger in the final search-row slot and own one fixed body portal; Enter submits point search, successful loads leave no status copy, and only compact errors may render."
  scoped_loading_overlays:
    pane_selector: "[data-pane-id]"
    display_canvas_selector: "[data-testid='display-workspace'] [data-testid='plot-grid']"
    integration: "Begin exact-pane loading before accepted type/valid Area output mutation and settle only its current ready/empty/error; begin one display-canvas overlay before layout mutation and settle only after matching accepted layout plus all initial output terminals. While layout loading is active, do not mount or flash pane overlays."
    spinner_animation: "Use the already-defined loader-rotate keyframes: 800ms linear infinite; 1600ms linear infinite for prefers-reduced-motion. Static projection is forbidden for these overlays."
  plot_autoscale:
    selector: "[data-pane-host] existing ready Plotly graph surface"
    integration: "Capture current output baseline after matching Plotly.react for all four plot types; preserve it through layout cleanup while the same signal-bearing pane/output identity remains; double-click relayouts only that host without linked-axis propagation or settings/backend mutation."
  linked_spectrum_axes:
    selector: "[data-pane-host] Spectrum/Persistence ready Plotly surfaces + Screen link fields"
    integration: "Frequency uses canonical Hz across pane units and linear/log coordinates; magnitude uses Spectrum dB ↔ Persistence power dB only. Spectrogram frequency, linear value axes, hidden fields and density are ignored."
  area_range_sliders:
    selector: "[data-settings-content] [data-setting-id$='limits'] + [data-screen-range-slider]"
    integration: "Reuse the exact existing Screen slider after every applicable visible Area range row for the active pane; endpoint touched state is independent and empty remains auto."
  pane_menu_anchor:
    trigger_selector: "[data-pane-menu]"
    portal_selector: "body > [data-testid='display-overflow-menu']"
    integration: "Position fixed against the clicked trigger, clamp to app-shell/viewport intersection with 8px inset, flip, reposition on resize/capture-scroll, close and restore focus when anchor leaves boundary."
  inspector_rows:
    selector: "[data-signal-rows]"
    integration: "Existing signals renderer keeps checkbox membership distinct from one [data-main-signal=true].is-main-signal row. Plain row LMB excludes controls/actions, ensures membership ON and selects main; direct checkbox changes membership only. Both use the existing revision flow."
  signal_settings_groups:
    selector: "[data-signal-settings-group]"
    integration: "Reuse existing .settings-group-title/.settings-group-fields disclosure; main and summary start expanded and are independently collapsible."
  optimistic_names:
    selector: "[data-setting-id='display.name'], [data-setting-id='pane.name']"
    integration: "Input events preview the draft immediately in the selected display tab or active pane title and settings context; autosave persists through existing queue."
  axis_limit_inputs:
    selector: "[data-setting-id$='limits'][data-range-part]"
    integration: "Render/edit in selected axis units; convert to canonical seconds/Hz only at the provider boundary; empty auto bounds remain empty."
  stable_checkbox_regions:
    selector: "[data-signal-rows], [data-testid='signal-add-variables']"
    integration: "Pending operations retain row and checkbox node identity plus checked state; only disabled and aria-busy change."
  workspace_context:
    selector: "[data-pane-id], [data-display-select], [data-testid='add-display'], [data-value-select-key$='::plot_type']"
    integration: "Pane click and accepted pane-type change select Area settings; display selection/creation selects Screen settings without remounting shell or settings panel."
  signal_color:
    selector: ".settings-panel .color-swatch-button, [data-signal-metadata='color']"
    integration: "One fixed 284px Jet popover is appended to body; its Apply writes only the existing Signal metadata draft and dispatches the existing input lifecycle."
  pane_menu:
    selector: "[data-testid='display-overflow-menu']"
    integration: "Reuse slider rows and append exactly two existing-style menuitemcheckbox rows before graph help: Курсор and Два курсора; all aria checks project the active pane."
  plot_host:
    selector: "[data-pane-host]"
    integration: "Projected extrema and slider layout keep existing Plotly paths; graph cursor controller reads data/fullLayout and appends only a sibling layer inside .plot-canvas, never children in the host."
  modal_portal:
    selector: body
    integration: "Append the signal-operation or cursor-trim singleton on first use; reuse existing modal stacking and [data-value-select-popup] only for the operation selector."

integration_seams:
  - id: application-bootstrap-readiness
    action_interface: "begin one token before state-lite; accept current-token state-lite containing signal/display/layout inventory; accept active-display settings; after initial DOM render call commitInitialRender in requestAnimationFrame; only all three milestones dismiss"
    production_consumers: [public/js/app.js]
    production_providers: [public/js/api.js, public/js/settings.js]
    controller: frontend-source/integration/js/task-0143-bootstrap-loader.js
    styles: frontend-source/integration/css/task-0143-bootstrap-loader.css
    hosts: [".app-status", "[data-testid='app-shell']"]
    timeout_ms: 20000
    excluded_from_barrier: [pane_outputs, signal_summary, signal_samples, measurements, extrema]
    retry: "new token and full required bootstrap chain; stale completion ignored"
    sanitized_error: "Не удалось загрузить данные анализатора. Проверьте соединение и повторите попытку."
    pointer_cursor: standard
  - id: synchronized-pane-ranges
    action_interface: "current pane Plotly/in-plot slider relayout => immediate selected-unit Area/Screen field and handle projection; valid settings edit => rAF-coalesced Plotly update; settled edge => one deduplicated frontend viewport commit; links reuse existing eligible frontend relayout queues"
    production_consumers: [public/js/app.js, public/js/settings.js]
    helper: frontend-source/integration/js/task-0144-synchronized-ranges.js
    hosts: ["[data-pane-host]", "[data-settings-content]"]
    plot_types: [time, spectrum, spectrogram, persistence]
    settings_groups: {parameters: axis_unit_fields, ranges: "single expanded user-collapsible Диапазоны group"}
    settle_boundary: {preview_event: plotly_relayouting, terminal_event: plotly_relayout, debounce_ms: 150, frontend_only: true}
    reset: "double-click settings range row/slider or graph ignores mirrored values, cancels older work, requests true Plotly autorange/full-domain and reprojects Auto/blank"
    validation: "TASK-0142 per-boundary validation gates preview/link/commit; invalid endpoints remain local only"
    persistence_forbidden: [settings.publishRange, api_settings, output_invalidation, dsp_recalculation, state_revision, session_persistence]
  - id: range-dom-generation-lifecycle
    action_interface: "Capture one exact range DOM set per display+pane+field generation; preview with Plotly.relayout only; terminal frontend commit patches those nodes without rerender/remount."
    production_consumers: [public/js/app.js]
    helper: frontend-source/integration/js/task-0146-range-lifecycle.js
    hosts: ["[data-setting-id$='limits']", "[data-screen-range-slider]", "[data-pane-id]", "[data-pane-host]"]
    e2e_hooks: [data-range-generation, data-range-sync-state, data-range-preview-active]
    begin: [settings_pointerdown, keyboard_first_edit, graph_relayout_begin]
    preview: "input or plotly_relayouting patches values/handles and calls Plotly.relayout with resize:false/rebuild:false; no width/height/overflow write, plot rebuild or settings render"
    terminal: "pointerup/change/keyboard commit or plotly_relayout; deduplicated 150ms frontend viewport commit"
    reset: "new shared generation cancels older settler/rAF, clears frontend viewport draft, patches blank Auto inputs/full-domain handles and requests true Plotly autorange"
    reset_axes: {time: [x, y], spectrum: [x, y], spectrogram: [x, y], persistence: [x, y], heatmap_z_color_range: preserve}
    stale_guard: "reject older frontend graph/input generations and any stale explicit projection after current Auto generation; no provider accept exists"
    persistence_forbidden: [settings.publishRange, api_settings, output_invalidation, dsp_recalculation, state_revision, session_persistence]
    preserves: [task_0142_boundary_validation, link_queues, selected_units, plotly_log_coordinates]
  - id: signal-membership-main
    action_interface: "row click => ensure active-pane membership ON then select that signal as main; direct checkbox => set active-pane membership only and never change main"
    production_consumers: [public/js/app.js]
    production_providers: [public/js/api.js]
    hosts: ["[data-signal-rows]", "[data-settings-content]"]
    state_separation: {checkbox: pane_membership_only, blue_row: main_signal_only, hidden_main_allowed: true}
    replacement_forbidden: true
  - id: signal-settings-disclosure
    action_interface: "render and toggle Signal Основное/Сводка through the existing settings-group disclosure contract; exact field label Дискретизация, Гц"
    production_consumers: [public/js/app.js]
    host: "[data-settings-content]"
    replacement_forbidden: true
  - id: complete-signal-summary
    action_interface: "render one vertical column with sample count/type/duration plus region start/end, min and position, max and position, mean, median, range and RMS regardless of Measurements column visibility; Values is owned by the settings footer"
    production_consumers: [public/js/app.js]
    production_providers: [public/js/api.js]
    host: "[data-signal-settings-group='summary']"
    replacement_forbidden: true
  - id: signal-color-draft
    action_interface: "open HEX + exact original eight swatches; preview nested draft; popover Apply updates Signal page draft; Cancel/Escape/outside restore opening color"
    production_consumers: [public/js/app.js]
    host: "document.body + [data-settings-content]"
    direct_api_call_forbidden: true
    busy_pointer_cursor: standard
    replacement_forbidden: true
  - id: busy-loading-standard-cursor
    action_interface: "retain normal arrow cursor for every busy/loading state while preserving existing pointer blocking, disabled controls, inert shell, aria-busy and spinner animation"
    production_consumers: [public/css/app.css]
    sources:
      - frontend-source/integration/css/task-0118-color-picker.css
      - frontend-source/integration/css/task-0139-loading-overlays.css
      - frontend-source/integration/css/task-0143-bootstrap-loader.css
      - frontend-source/integration/css/task-0145-standard-busy-cursor.css
    required_cursor: default
    forbidden_cursors: [wait, progress]
    behavior_changes_forbidden: [spinner_visuals, spinner_animation, pointer_blocking, aria_busy, inertness, geometry, request_lifecycle]
  - id: settings-context-routing
    action_interface: "pane click or accepted pane-type mutation -> Area settings; display-tab/add-display click -> Screen settings"
    production_consumers: [public/js/app.js]
    hosts: ["[data-pane-id]", "[data-display-select]", "[data-testid='add-display']", "[data-settings-page]"]
    replacement_forbidden: true
  - id: automatic-main-signal-samples
    action_interface: "valid main signal => ensure/rebind named sample tab and request first page without focus; Values => expand inspector, guarantee/select/focus tab and request missing page 1"
    production_consumers: [public/js/app.js]
    production_providers: [public/js/api.js]
    hosts: [".inspector-tabs", "[data-inspector-content]"]
    full_array_in_dom_or_state_forbidden: true
    replacement_forbidden: true
  - id: optimistic-name-preview
    action_interface: "display.name or pane.name input => update the matching existing header/tab and settings context in the same frame; preserve debounced autosave"
    production_consumers: [public/js/app.js]
    hosts: ["[data-setting-id='display.name']", "[data-setting-id='pane.name']", "[data-display-select]", "[data-pane-id]", "[data-settings-context]"]
    replacement_forbidden: true
  - id: input-history-opt-out
    action_interface: "decorate all settings/dialog text/search/numeric inputs with autocomplete off and non-profile metadata; never show browser history/profile suggestions"
    production_consumers: [public/js/app.js, public/js/settings.js]
    replacement_forbidden: true
  - id: selected-unit-axis-limits
    action_interface: "display/edit current Plotly viewport mirrors in selected units, preserve the physical interval on unit changes, use seconds/Hz only for frontend projection and links, preserve empty Auto bounds"
    production_consumers: [public/js/app.js]
    host: "[data-setting-id$='limits'][data-range-part]"
    persistence_forbidden: true
    replacement_forbidden: true
  - id: original-default-colors
    provider_interface: "automatic signal colors cycle only through the restored eight values exposed by SignalColorPickerUI.palette"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    palette: ["#2563eb", "#dc2626", "#16a34a", "#9333ea", "#ea580c", "#0891b2", "#ca8a04", "#db2777"]
  - id: checkbox-mutation-continuity
    action_interface: "retain visible signal/catalog rows and checkbox nodes plus checked state while pending; set disabled and aria-busy in place"
    production_consumers: [public/js/app.js]
    hosts: ["[data-signal-rows]", "[data-testid='signal-add-variables']"]
    row_replacement_while_pending_forbidden: true
  - id: viewport-scoped-extrema
    provider_interface: "read active Plotly visible X interval and send optional visible_range: TIME {min_s,max_s}, SPECTRUM {min_hz,max_hz}; absent means full domain; ignore Y zoom"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    hosts: ["[data-pane-host]", "[data-testid='extrema-values']"]
  - id: signal-sample-rate-draft
    action_interface: "editable Дискретизация, Гц metadata; positive finite dot-decimal UI validation; debounced autosave persistence"
    production_consumers: [public/js/app.js]
    production_providers: [public/js/api.js]
    host: "[data-settings-content]"
    replacement_forbidden: true
  - id: settings-page-extension
    action_interface: "ensure signal tab; render Signal/Area/Screen/Extrema into existing settings content"
    production_consumers: [public/js/app.js, public/js/settings.js]
    hosts: ["[data-testid='settings-tabs']", "[data-settings-content]", "[data-testid='settings-footer']"]
    replacement_forbidden: true
  - id: pane-slider-visibility
    action_interface: "get/set active pane x/y slider visibility from pane menu or settings checkbox; synchronously project both controls from one draft"
    production_consumers: [public/js/app.js, public/js/settings.js]
    hosts: ["[data-plot-range-slider]", "[data-plot-amplitude-slider]", "[data-settings-content]", "[data-pane-host]"]
    replacement_forbidden: true
  - id: pane-graph-cursors
    action_interface: "Курсор/Два курсора menu click => mutually exclusive pane-local off/single/dual state; active click => off; attach/update after Plotly react and relayout; clear with pane"
    production_consumers: [public/js/app.js]
    hosts: ["[data-testid='display-overflow-menu']", "[data-pane-host]", ".plot-canvas"]
    frontend_state_only: true
    backend_session_revision_forbidden: true
    api_dsp_calls_forbidden: true
    linked_pane_cursor_propagation_forbidden: true
    finite_zero_is_valid_nearest_candidate: true
    plotly_host_dom_mutation_forbidden: true
    eligible_plot_types: [time, spectrum]
    subscription_interface: "snapshot(paneRuntimeKey) + subscribe(listener), emitted after mode, pointer, keyboard and relayout reconciliation; pane cleanup clears state and notifies"
    replacement_forbidden: true
  - id: measurement-cursor-columns
    action_interface: "existing Measurements three-dot menu toggles six pane-local latent intents; current cursor snapshot gates effective columns and updates cells live"
    production_consumers: [public/js/app.js]
    helper: frontend-source/integration/js/task-0148-measurement-cursor-columns.js
    styles: frontend-source/integration/css/task-0148-measurement-cursor-columns.css
    hosts: ["[data-testid='measurement-columns-menu-trigger']", "[data-testid='measurement-columns-menu']", "[data-testid='measurement-table']"]
    stable_selectors: ["[data-measurement-cursor-column]", "[data-measurement-cursor-value]"]
    eligibility: {off: [], single: [x1, y1], dual: [x1, y1, x2, y2, delta_x, delta_y], non_time_spectrum: []}
    trace_mapping: exact_legendgroup_then_first_visible_non_overlay_plotly_trace
    cleanup: "pane removal deletes its latent intent/subscription; active pane/type/mode drop immediately removes ineligible columns without disturbing existing measurement columns"
    backend_calls_forbidden: true
  - id: pane-axis-labels-and-hover-policy
    action_interface: "persist display.show_axis_labels per pane and apply title-text-only relayout/restyle; normalize every Plotly payload/overlay trace to no native hover"
    production_consumers: [public/js/app.js, public/js/settings.js]
    helper: frontend-source/integration/js/task-0150-0151-axis-labels-hover.js
    hosts: ["[data-setting-id='display.show_axis_labels']", "[data-pane-host]"]
    stable_selectors: ["[data-testid='settings-show-axis-labels']", "[data-pane-host]"]
    output_invalidation_forbidden: true
    cleanup: "pane removal drops cached semantic-title/visibility record; new accepted plot payload recaptures provider titles before projection"
  - id: cursor-trim-signal
    action_interface: "eligible dual-cursor Time context shows one header action, opens one operation-style modal and submits an inclusive sorted sample interval through the revision-safe signal mutation queue"
    production_consumers: [public/js/app.js]
    production_provider: public/js/api.js
    helper: frontend-source/integration/js/task-0152-cursor-trim-signal.js
    markup: frontend-source/integration/html/dialogs/signal-trim.fragment.html
    hosts: ["[data-pane-id] .pane-header", "body > [data-testid='signal-trim-layer']", "[data-signal-rows]"]
    stable_selectors: ["[data-testid='pane-trim-signal']", "[data-testid='signal-trim-dialog']", "[data-signal-trim-name]", "[data-signal-trim-overwrite]", "[data-signal-trim-submit]", "[data-signal-trim-status]"]
    api: {method: POST, path: /api/signals/crop, exact_request: [state_revision, source_signal_id, min_s, max_s, target_name, overwrite], extra_fields: forbidden, accept: returned_signal_or_authoritative_inventory}
    projection: "sort cursor X values and convert selected Time-axis units to canonical seconds; sample indices remain backend-owned and absent from payload"
    cleanup: "pane/type/main-signal/mode/cursor invalidation hides/removes the action; modal close removes busy/error state; pane removal invalidates pending UI token and detaches cursor subscription; stale response cannot reopen or focus a removed pane"
  - id: projected-spectrum-extrema
    provider_interface: "read projected spectrum extrema for active display/pane/signal and expose ready/loading/error rows plus marker coordinates"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    hosts: ["[data-pane-host]", "[data-inspector-content]"]
    ui_does_no_dsp_or_unit_projection: true
  - id: signal-summary-provider
    provider_interface: "read main-signal metadata and summary for the active pane"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    host: "[data-settings-content]"
  - id: signal-samples-pagination
    provider_interface: "get at most 500 rows by stable signal id and authoritative zero-based start; point jump uses clamp(target-250,0,total-500), replaces window and center-scrolls target; ordinary 500/1000/100 sliding resumes"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    hosts: [".inspector-tabs", "[data-inspector-content]"]
    window_controller: frontend-source/integration/js/task-0134-sample-row-window.js
    search_marker_helper: frontend-source/integration/js/task-0135-sample-search-markers.js
    api_batch_rows: 500
    max_dom_rows: 1000
    prefetch_threshold_rows: 100
    footer_format: "{start}–{end} из {total}"
    scroll_compensation: "scrollTop += controller.scrollCompensation(result, measuredRenderedRowHeight); downward trim returns -500 rows, upward prepend returns +500 rows"
    guards: [stable_signal_id, stable_window_token, duplicate_same_direction_suppressed]
    full_array_in_dom_or_app_state_forbidden: true
  - id: signal-sample-calculated-columns
    provider_interface: "each sample row may contain magnitude, square and signed_square_root_magnitude as provider-authored display values; square_root is ignored and absent from UI"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    helper: frontend-source/integration/js/task-0138-values-columns.js
    styles: frontend-source/integration/css/task-0138-values-columns.css
    hosts: ["[data-testid='inspector-pane-samples']", ".samples-point-search-row", ".sample-table", "body > [data-testid='sample-columns-menu']"]
    base_columns_always_visible: [sample_index, time, value]
    optional_columns: [magnitude, square, signed_square_root_magnitude]
    optional_columns_default_hidden: [magnitude, square, signed_square_root_magnitude]
    visibility_state: frontend_only_no_api_no_revision
    ui_calculation_forbidden: true
    unresolved_product_dependencies: [multiply_parameter_semantics, custom_body_name_lifecycle]
  - id: sample-time-extrema-markers
    provider_interface: "read current peaks record by record.displayId/paneId; TIME only; filter row.signal_name via existing signalNameMatches exact fallback; map row.sample_index and row.signal_color; lowest finite graph_number wins"
    production_consumer: public/js/app.js
    hosts: ["[data-inspector-content]", ".sample-table"]
    spectrum_bin_mapping_forbidden: true
  - id: signal-operation-provider
    provider_interface: "submit {operation, source, body, target_name, overwrite, multiplier}; backend owns Engee recv envelope/temp binding/cleanup"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    portal: body
    ui_options_filter: "frontend-source/integration/js/task-0139-ui-inventory.js removes fft before rendering SignalAnalyserValueSelect; backend FFT may remain callable outside this UI"
  - id: scoped-output-loading
    action_interface: "beginPane before accepted pane-type or valid Area-settings output mutation; settle matching pane token at ready/empty/error; beginLayout before add/remove/rows/columns mutation; settle matching layout token only after accepted layout and every initial pane output terminal"
    production_consumer: public/js/app.js
    controller: frontend-source/integration/js/task-0139-loading-overlays.js
    styles: frontend-source/integration/css/task-0139-loading-overlays.css
    hosts: ["[data-testid='display-workspace']", "[data-testid='plot-grid']", "[data-pane-id]"]
    overlay_priority: "layout overlay suppresses all pane overlays; no pane flash under display reconciliation"
    stale_completion_policy: ignore
    invalid_area_draft_policy: no_loader
    spinner_animation: {keyframes: loader-rotate, normal: "800ms linear infinite", reduced_motion: "1600ms linear infinite", static_forbidden: true}
  - id: pane-plot-autoscale
    action_interface: "double-click ignores numeric mirrors and requests true Plotly autorange/full-domain for both spatial axes, then atomically clears/reprojects frontend range nodes for the clicked pane and eligible linked panes"
    production_consumer: public/js/app.js
    helper: frontend-source/integration/js/task-0140-plot-autoscale.js
    host: "[data-pane-host]"
    eligible_plot_types: [time, spectrum, spectrogram, persistence]
    baseline_lifecycle: "retain pane/output identity and slider visibility only; numeric ranges are never captured as a reset baseline"
    slider_state_eligibility: [time, spectrum]
    log_range_semantics: preserve_plotly_coordinates
    isolation: [clicked_pane_plus_enabled_frontend_links_only, no_range_settings_or_revision, no_backend_or_dsp, no_main_signal_change, no_heatmap_color_range_change]
  - id: linked-spectrum-persistence-axes
    action_interface: "when enabled, ready Spectrum/Persistence frequency relayouts project canonical Hz to every other eligible pane; ready dB Spectrum magnitude/Persistence power relayouts project the same dB range"
    production_consumer: public/js/app.js
    helper: frontend-source/integration/js/task-0141-linked-axes-area-sliders.js
    eligible_frequency: [spectrum, persistence]
    eligible_magnitude: [spectrum_db, persistence_db]
    ignored: [spectrogram_frequency, spectrogram_power, persistence_density, linear_value_axes, hidden_fields]
  - id: area-range-slider-parity
    action_interface: "render the exact Screen dual-handle slider for each visible applicable active-pane range field; preserve independent empty auto endpoints until their own interaction"
    production_consumers: [public/js/app.js, public/js/settings.js]
    helper: frontend-source/integration/js/task-0141-linked-axes-area-sliders.js
  - id: heatmap-jet
    provider_interface: "Backend output supplies colorscale Jet for Spectrogram and Persistence; Frontend passes accepted Plotly payload through unchanged"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    frontend_override_forbidden: true
  - id: pane-menu-anchor
    action_interface: "position unchanged body-portal menu from clicked [data-pane-menu] within app-shell/viewport 8px boundary; flip/reposition/close with focus restoration"
    production_consumer: public/js/app.js
    helper: frontend-source/integration/js/task-0141-linked-axes-area-sliders.js
  - id: new-display-default-layout
    provider_interface: "Backend create-display response already contains default 2x2/four-empty-pane layout and active first pane; existing/imported layouts retain their accepted state"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    frontend_pane_or_id_generation_forbidden: true
  - id: stable-name-state
    provider_interface: "persist display/pane names by stable ids and allocate monotonic default ordinals"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
  - id: range-boundary-validation
    action_interface: "project existing numeric/finite/domain/order/unit validation independently to Min and Max; both invalid inputs keep red borders while exactly one message uses Min-first priority"
    production_consumers: [public/js/settings.js, public/js/app.js]
    helper: frontend-source/integration/js/task-0142-range-boundary-validation.js
    styles: frontend-source/integration/css/task-0142-range-boundary-validation.css
    host: "[data-setting-id$='limits'][data-range-part]"
    enablement: "disable only when the visible control is truly inapplicable or current settings mutation is busy; automatic, slider and link state never disable an applicable endpoint"
    raw_backend_error_as_field_copy_forbidden: true
    message_priority: [min, max]

