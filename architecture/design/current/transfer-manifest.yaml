  production_sources_rendered_in_place: [public/css/theme.css, public/css/app.css, public/js/api.js, public/js/value-select.js, public/js/numeric.js, public/js/settings.js, public/js/layouts.js, public/vendor/vue/3.5.41/vue.global.prod.js, public/js/components/explicit-apply.js, public/js/native-session-io.js, public/js/app.js]
  pinned_hashes: evidence/production-baseline-v32.json
  walkthrough: [evidence/interaction-walkthrough-v31-standalone.json, evidence/interaction-walkthrough-v32-standalone.json, evidence/interaction-contract-v34.json, evidence/interaction-walkthrough-v36-graph-cursors.json, evidence/interaction-regression-v37-zero-snap.json, evidence/interaction-regression-v38-color-swatch.json, evidence/interaction-regression-v39-sample-row-window.json, evidence/interaction-regression-v40-sample-search-markers.json, evidence/interaction-regression-v41-values-columns.json, evidence/interaction-regression-v42-sample-search-row.json, evidence/interaction-regression-v43-task0139.json, evidence/interaction-regression-v44-task0140.json, evidence/interaction-regression-v45-task0141.json, evidence/interaction-regression-v46-task0142.json, evidence/interaction-regression-v48-task0143-0144.json, evidence/interaction-regression-v51-task0143-0146.json, evidence/interaction-regression-v52-task0143-0146.json, evidence/interaction-regression-v52-task0148.json, evidence/interaction-regression-v52-task0150-0151.json, evidence/interaction-regression-v54-task0152.json]
  transfer_audit: evidence/transfer-audit-v46.json
  result: "V54 keeps the V53 UI and corrects TASK-0152 to the accepted /api/signals/crop contract with an exact canonical-seconds payload."

# Production already owns the document, boot sequence, UI modules and Plotly
# hosts. Only the already-identical local icon inventory is copied directly;
# integration/** is intentionally transferred through additive_fragments below.
copy_as_is:
  - {from: icons/, to: icons/}

frontend_source_exclude:
  - integration/**

frontend_owned_not_copied:
  # The dialog fragment is relocated into public/js/app.js, where ./icons is
  # the application icon root. This declaration resolves that relocation for
  # package-local reference validation without copying a duplicate asset.
  - public/integration/html/dialogs/icons/close.svg

production_invariants:
  - path: public/index.html
    policy: immutable
    reason: "Existing application shell, script order, static tabs, pane menu and overlay roots stay authoritative."
  - path: public/js/app.js
    policy: extend_in_place_never_replace
    preserve: [bootstrap, model_lifecycle, existing_renderers, Plotly_queue, event_delegation]
  - path: public/js/settings.js
    policy: extend_in_place_never_replace
    preserve: [settings_document_lifecycle, draft_revision, validation, serialized_autosave]
  - path: public/js/api.js
    policy: extend_in_place_never_replace
    preserve: [request_transport, error_projection, existing_exports]
  - path: public/js/value-select.js
    policy: reuse_unchanged
    reason: "Operation uses the existing production SignalAnalyserValueSelect; design copy is mock-only."
  - selector: "[data-pane-host]"
    owner: "public/js/app.js + Plotly"
    policy: never_replace_or_overwrite_dom
    allowed: ["Plotly.react using the existing queue", "Plotly.relayout", "existing amplitude-slider overlay path"]

