    plotly_dom_mutation_forbidden: true
    api_and_dsp_calls_forbidden: true
  - id: linked-axis-draft
    ui_contract: "move identical range controls by linked scope; live frequency zoom synchronizes Spectrum↔Persistence through canonical Hz across selected units and linear/log axes; live magnitude synchronizes Spectrum dB↔Persistence power dB only"
    helper: frontend-source/integration/js/task-0141-linked-axes-area-sliders.js
