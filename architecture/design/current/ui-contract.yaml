  task_0140_source_result: {delta_checks: 6, passed: 6, failed: 0, method: bounded_source_contract, new_visual_component: false, new_screenshot: false}
  task_0141_source_result: {delta_checks: 9, passed: 9, failed: 0, method: bounded_source_contract, new_visual_component: false, new_screenshot: false}
  task_0142_source_result: {delta_checks: 5, passed: 5, failed: 0, method: bounded_source_contract, new_visual_component: false, new_screenshot: false}

screens:
  - id: main
    route: "/"
    layout_source: "current production geometry + explicit user requirements"
    root_testid: app-shell
    zones:
      - id: toolbar
        type: toolbar
        purpose: "Brand, import, save, help"
        parent: main
        slot: toolbar
        repeated: false
        production_host: "public/index.html .application-toolbar"
        transfer: none_existing_production_zone
        design_mock: {html: frontend-source/html/zones/toolbar/view.html, css: frontend-source/css/zones/toolbar/style.css, ui_js: frontend-source/js/ui/zones/toolbar/ui.js}
        sizing: {min_width: 920, min_height: 44, width_growth_ratio: 1, height_growth_ratio: 0}
        scroll: {owner: none, axes: none, sticky: []}
        collapse: {allowed: false, initial: expanded, direction: null, reason: null}
        states: [default, hover, pressed, focus_visible, disabled]
      - id: plot-workspace
        type: graph
        purpose: "Stable screens, pane headers, Time/Spectrum/Spectrogram/Persistence plots, plot sliders, pane-local cursors, extrema markers and type-correct pane-local autoscale"
        parent: main-stage
        slot: workspace
        repeated: false
        production_host: "public/index.html [data-testid='display-workspace']; Plotly hosts [data-pane-host]"
        transfer: additive_existing_app_and_plotly_seams_only
        design_mock: {html: frontend-source/html/zones/workspace/view.html, css: frontend-source/css/zones/workspace/style.css, ui_js: frontend-source/js/ui/zones/workspace/ui.js}
        sizing: {min_width: 612, min_height: 440, width_growth_ratio: 3, height_growth_ratio: 4}
        scroll: {owner: display-tablist, axes: x, sticky: [workspace-titlebar, display-tabs]}
        collapse: {allowed: false, initial: expanded, direction: null, reason: null}
        states: [ready, empty, pane_loading, display_layout_loading, error, active_pane, linked_zoom, autoscale_reset, cursor_off, cursor_single, cursor_dual, cursor_dragging]
      - id: display-settings
        type: settings
        purpose: "Signal, Area and Screen automatic settings plus explicit Extrema calculation"
        parent: main-stage
        slot: settings
        repeated: false
        tabs: [signal, display, screen, peaks]
        production_host: "[data-testid='settings-tabs'] + [data-settings-content] + [data-testid='settings-footer']"
        transfer: additive_existing_settings_renderers_only
        design_mock: {html: frontend-source/html/zones/settings/view.html, css: frontend-source/css/zones/settings/style.css, ui_js: frontend-source/js/ui/zones/settings/ui.js}
        sizing: {min_width: 300, min_height: 440, width_growth_ratio: 1, height_growth_ratio: 4}
        scroll: {owner: settings-scroll, axes: y, sticky: [settings-heading, settings-tabs, settings-footer]}
        collapse: {allowed: false, initial: expanded, direction: null, reason: null}
        states: [pristine, dirty, applying, applied, range_min_invalid, range_max_invalid, range_both_invalid, error, empty_context]
      - id: lower-inspector
        type: table
        purpose: "Signals, measurements, extrema and dynamic samples"
        parent: main
        slot: inspector
        repeated: false
        tabs: [signals, measurements, peaks, dynamic-main-signal]
        production_host: ".inspector-tabs + [data-inspector-content] + [data-signal-rows]"
        transfer: additive_existing_inspector_renderer_only
        design_mock: {html: frontend-source/html/zones/inspector/view.html, css: frontend-source/css/zones/inspector/style.css, ui_js: frontend-source/js/ui/zones/inspector/ui.js}
        sizing: {min_width: 920, min_height: 180, width_growth_ratio: 1, height_growth_ratio: 1}
        scroll: {owner: inspector-body, axes: both, sticky: [inspector-header, table-header, samples-footer]}
        collapse: {allowed: true, initial: split, direction: vertical, reason: "Existing explicit user-controlled lower-panel states"}
        states: [split, expanded, collapsed, ready, loading_page, loading_up, loading_down, window_shift_up, window_shift_down, search_typing, search_invalid, search_loading, end_of_data, empty, error]
      - id: signal-operation-dialog
        type: dialog
        purpose: "Create one derived signal using a built-in operation or a user operation body executed by Engee"
        parent: main
        slot: signal-operation
        repeated: false
        production_host: "document.body singleton [data-testid='signal-operation-layer']"
        transfer: {markup: frontend-source/integration/html/dialogs/signal-operation.fragment.html, css: frontend-source/integration/css/task-0112-0115-additions.css, ui: public/js/app.js additive state machine}
        design_mock: {html: frontend-source/html/dialogs/signal-operation/view.html, css: frontend-source/css/dialogs/signal-operation.css, ui_js: frontend-source/js/ui/dialogs/signal-operation.js}
        sizing: {min_width: 660, min_height: 300, width_growth_ratio: 0, height_growth_ratio: 0}
        scroll: {owner: dialog-body, axes: y, sticky: [dialog-titlebar, dialog-actions]}
        collapse: {allowed: false, initial: expanded, direction: null, reason: null}
        states: [closed, built_in, menu_open, custom, busy, error, success]
      - id: signal-color-picker
        type: popover
        purpose: "Edit nested Signal color draft through HEX or the restored original eight-color palette"
        parent: display-settings
        slot: body-fixed-overlay
        repeated: false
        production_host: "document.body singleton [data-testid='signal-color-picker']"
        transfer: {css: frontend-source/integration/css/task-0118-color-picker.css, ui: frontend-source/integration/js/task-0118-color-picker.js}
        sizing: {width: 284, min_height: 204, width_growth_ratio: 0, height_growth_ratio: 0}
        scroll: {owner: none, axes: none, sticky: []}
        collapse: {allowed: false, initial: closed, direction: null, reason: null}
        states: [closed, open, hover, selected_draft, invalid_hex, busy]
        selected_swatch_geometry: {target: 32, color_square: 24, color_square_box_sizing: border_box, halo_inset_all_sides: 4, tick_render: proportional_optically_centered}
      - id: graph-cursor-overlay
        type: graph_overlay
        purpose: "Pane-local snapped X cursors and trace values for ready Time/Spectrum plots"
        parent: plot-workspace
        slot: "eligible pane .plot-canvas sibling of [data-pane-host]"
        repeated: true
        production_host: ".plot-canvas + stable [data-pane-host] coordinate source"
        transfer: {css: frontend-source/integration/css/task-0130-graph-cursors.css, ui: frontend-source/integration/js/task-0130-graph-cursors.js}
        sizing: {width: plot_rect, min_height: plot_rect, width_growth_ratio: 1, height_growth_ratio: 1}
        scroll: {owner: none, axes: none, sticky: []}
        collapse: {allowed: false, initial: closed, direction: null, reason: null}
        states: [off, single, dual, hover, focus_visible, dragging, clamped_after_relayout]

capabilities:
  toolbar: present
  settings: {status: present, mode: multi_tab}
  data_tables: {status: present, mode: multi_tab}
  graphs: {status: present, mode: multi_layout}
  dialogs: present
  import_export: present

production_hosts:
  settings:
    tabs: "[data-testid='settings-tabs']"
    content: "[data-settings-content][data-testid='settings-content']"
    footer: "[data-testid='settings-footer']"
    autosave: "public/js/settings.js requestQueue + public/js/app.js publication queue"
    policy: "insert/render affected controls only; never replace settings panel or create another Apply"
  inspector:
    tabs: ".inspector-tabs"
    body: "[data-inspector-content]"
    signal_rows: "[data-signal-rows]"
    row_actions: ".signal-row-actions"
    duplicate_action: "[data-signal-duplicate]"
    operation_action: "[data-signal-operation]"
    policy: "extend existing tab/page/row renderers; preserve inspector shell and existing rows"
  pane_menu:
    root: "[data-testid='display-overflow-menu']"
    x_slider_action: "[data-plot-range-slider]"
    y_slider_action: "[data-plot-amplitude-slider]"
    single_cursor_action: "[data-plot-cursor-mode='single']"
    dual_cursor_action: "[data-plot-cursor-mode='dual']"
  plots:
    hosts: "[data-pane-host]"
    policy: "Plotly-owned descendants remain untouched; cursor layer is an absolute sibling inside .plot-canvas and reads host data/fullLayout only"
  dialogs:
    portal: body
    operation_singleton: "[data-testid='signal-operation-layer']"
    shared_select_popup: "[data-value-select-popup]"

settings_tabs:
  - id: signal
    order: 1
    label: "Сигнал"
    testid: settings-tab-signal
    visibility: "visible only when active pane has main_signal"
    groups:
      - id: signal-main
        label: "Основное"
        disclosure: {component: settings-group, initial: expanded, user_collapsible: true, state_owner: active_signal_editor}
        fields:
          - {id: signal-name, label: "Имя", type: text, testid: signal-name, autocomplete: off, states: [default, focus_visible, dirty, invalid, disabled]}
          - {id: signal-color, label: "Цвет", type: color_picker_plus_text, testid: signal-color, autocomplete: off, states: [default, hover, focus_visible, open, invalid]}
          - {id: signal-sample-rate, label: "Дискретизация, Гц", type: editable_metadata_numeric, unit_in_label: true, testid: signal-sample-rate, inputmode: decimal, autocomplete: off, format: positive_finite_dot_decimal, persisted_by: settings-autosave, states: [default, focus_visible, dirty, invalid, applying]}
      - id: signal-summary
        label: "Сводка"
        disclosure: {component: settings-group, initial: expanded, user_collapsible: true, state_owner: active_signal_editor}
        layout: {columns: 1, direction: vertical}
        authored_by: backend
        values: [sample_count, data_type, duration, region_start, region_end, minimum, minimum_position, maximum, maximum_position, mean, median, peak_to_peak, rms]
        value_labels: {sample_count: "Отсчёты", data_type: "Тип", duration: "Длительность", region_start: "Начало области", region_end: "Конец области", minimum: "Минимум", minimum_position: "Время минимума", maximum: "Максимум", maximum_position: "Время максимума", mean: "Среднее", median: "Медиана", peak_to_peak: "Размах", rms: "СКЗ"}
        completeness: "independent of Measurements table column visibility; hidden measurement columns remain present in Summary"
        actions: []
  - id: display
    order: 2
    label: "Область"
    testid: settings-tab-display
    groups:
      - id: area-main
        label: "Основное"
        fields: [pane-name, plot-type]
        pane_name: {autocomplete: off, optimistic_preview_targets: [active-pane-header, settings-context], preview_on: input, persistence: debounced_autosave}
        plot_type_transition: "after accepted plot-type mutation, select Area and render only Area content even when Signal was previously active"
      - id: area-parameters
        label: "Параметры"
        time_fields: [show-legend, show-time-range-slider, show-amplitude-slider]
        spectrum_fields: [show-legend, show-frequency-slider, show-magnitude-slider]
        hidden_when_inapplicable: true
      - id: area-range-sliders
        label: "Локальные пределы"
        component: screen-range-slider
        scope: active_pane_only
        exact_field_map:
          time: [time.x_limits, time.y_limits]
          spectrum: [spectrum.frequency_limits, spectrum.y_limits]
          spectrogram: [time.x_limits, spectrogram.frequency_limits, spectrogram.power_limits]
          persistence: [persistence.frequency_limits, persistence.power_limits, persistence.density_limits]
        link_visibility: "hide only the field owned by an active compatible link; Spectrogram frequency/power and Persistence density always remain local; dB link never hides a linear Spectrum/Persistence value field"
        empty_endpoint_policy: "each Min/Max remains empty auto until that exact input or thumb is interacted with; moving one thumb does not materialize the untouched endpoint"
      - id: local-time-limits
        label: "Пределы времени"
        component: axis-limits
        visible_when: "time_link=false and time pane"
      - id: local-amplitude-limits
        label: "Пределы амплитуды"
        component: axis-limits
        visible_when: "amplitude_link=false and time pane"
      - id: local-frequency-limits
        label: "Пределы частоты"
        component: axis-limits
        visible_when: "spectrum_frequency_link=false and spectrum pane"
      - id: local-magnitude-limits
        label: "Пределы магнитуды"
        component: axis-limits
        visible_when: "spectrum_magnitude_link=false and spectrum pane"
      - id: spectrum-analysis
        label: "Спектральный анализ"
        fields: [spectrum-scale, frequency-scale, window, dft-points, overlap]
        states: [expanded, collapsed]
        visibility: "spectrum pane only; hidden parameters are not validated"
  - id: screen
    order: 3
    label: "Экран"
    testid: settings-tab-screen
    groups:
      - id: screen-main
        label: "Основное"
        fields: [display-name]
        display_name: {autocomplete: off, optimistic_preview_targets: [active-display-tab, settings-context], preview_on: input, persistence: debounced_autosave}
      - id: screen-layout
        label: "Макет"
        initial: collapsed
        fields: [rows-columns]
      - id: screen-links
        label: "Связь областей"
        fields:
          - {id: link-time, label: "Связать время", type: checkbox}
          - {id: link-amplitude, label: "Связать амплитуду", type: checkbox}
          - {id: link-spectrum-frequency, label: "Связать частоты", type: checkbox, eligible_panes: [spectrum, persistence], excluded_panes: [spectrogram]}
          - {id: link-spectrum-magnitude, label: "Связать магнитуды", type: checkbox, eligible_panes: [spectrum_db, persistence_db], mapping: "spectrum magnitude dB ↔ persistence power dB"}
        divider_between_fields: false
      - {id: screen-time-limits, label: "Пределы времени", component: axis-limits, visible_when: "link-time=true"}
      - {id: screen-amplitude-limits, label: "Пределы амплитуды", component: axis-limits, visible_when: "link-amplitude=true"}
      - {id: screen-frequency-limits, label: "Пределы частоты", component: axis-limits, visible_when: "link-spectrum-frequency=true"}
      - {id: screen-magnitude-limits, label: "Пределы магнитуды / мощности, dB", component: axis-limits, visible_when: "link-spectrum-magnitude=true", eligible_fields: [spectrum.y_limits, persistence.power_limits]}
  - id: peaks
    order: 4
    label: "Экстремумы"
    testid: settings-tab-peaks
    visibility: "time and spectrum only; hidden otherwise"
    groups:
      - id: extrema-calculation
        fields: [mode, count, cutoff, minimum-distance, threshold]
      - id: extrema-presentation
        fields: [show-markers, projected-coordinate-note]
    actions:
      - {id: show-extrema-values, label: "Рассчитать", testid: extrema-values}

components:
  axis-limits:
    exact_same_markup_for_scopes: [area, screen]
    exact_slider_hook: "[data-screen-range-slider]"
    area_scope: active_pane_only
    endpoint_intent: "Min and Max have independent touched state; untouched empty endpoint remains auto even when the other thumb moves"
    state_model: {canonical_time: seconds, canonical_frequency: hertz, visible_values: selected_axis_unit}
    fields:
      - {id: units, type: select, options_by_axis: {time: [auto, s, ms, us, ns], frequency: [auto, Hz, kHz, MHz], amplitude: [], magnitude: []}}
      - {id: minimum, type: text_numeric, autocomplete: off, empty_semantics: auto_full_minimum, placeholder: "Мин.", display_unit: selected_axis_unit}
      - {id: maximum, type: text_numeric, autocomplete: off, empty_semantics: auto_full_maximum, placeholder: "Макс.", display_unit: selected_axis_unit}
      - {id: double-slider, type: dual_thumb_horizontal_slider, reset: double_click_to_auto}
    states: [default, hover, drag_min, drag_max, keyboard_focus, dirty, min_invalid, max_invalid, both_invalid, busy_disabled, inapplicable_hidden]
    enablement: "A visible applicable Min/Max remains editable in automatic mode and regardless of plot-slider or link state. Disable only while the owning settings mutation is busy; a truly inapplicable range is hidden, not shown disabled."
    validation:
      scope: "each visible endpoint has an independent validator and aria-invalid state"
      reasons: [number, finite, domain, order, unit]
      border: "2px danger border on each invalid input only; pair wrapper, row and group never receive an error border"
      message_priority: "render exactly one local message; minimum error first, otherwise maximum"
      copy:
        min: {number: "Введите число для минимума.", finite: "Минимум должен быть конечным.", domain: "Минимум вне допустимого диапазона.", order: "Минимум должен быть меньше максимума.", unit: "Минимум нельзя представить в выбранных единицах."}
        max: {number: "Введите число для максимума.", finite: "Максимум должен быть конечным.", domain: "Максимум вне допустимого диапазона.", order: "Максимум должен быть больше минимума.", unit: "Максимум нельзя представить в выбранных единицах."}
      raw_backend_or_internal_exception_copy: forbidden
    projection: "On unit selection, nonempty numeric drafts are immediately reprojected without changing their physical canonical interval. Saving converts time to seconds and frequency to hertz. Empty auto Min/Max stay empty and keep placeholders."
    valid_projection_message: "No seconds/Hz mismatch warning is shown when a displayed number is valid in the selected unit."
  plot-slider:
    variants:
      - {id: time-range, orientation: horizontal, pane_types: [time]}
      - {id: amplitude, orientation: vertical, pane_types: [time]}
      - {id: spectrum-frequency, orientation: horizontal, pane_types: [spectrum]}
      - {id: spectrum-magnitude, orientation: vertical, pane_types: [spectrum]}
    independent_visibility: true
    control_projections:
      pane_menu:
        host: "[data-testid='display-overflow-menu']"
        x_axis_control: "[data-plot-range-slider]"
        y_axis_control: "[data-plot-amplitude-slider]"
        spectrum_labels: ["Слайдер частоты", "Слайдер магнитуды"]
      settings_checkboxes:
        host: "[data-settings-content]"
        group: area-parameters
        spectrum_fields: [show-frequency-slider, show-magnitude-slider]
    synchronization: "Both projections read/write the same active-pane draft immediately; menu aria-checked and settings checked state must never diverge."
    persistence: "Existing serialized autosave persists the shared draft; neither projection owns a second state."
    plot_host_mutation: "Use existing Plotly layout/relayout, amplitude-slider path and cursor sibling overlay only; never overwrite [data-pane-host]."
    states: [hidden, default, hover, drag, keyboard_focus, reset]
  persisted-name:
    entities: [display, pane]
    visible_source: persisted_name
    id_source: stable_id
    default_ordinal: monotonic_never_automatic_reuse
    preview: "Each input event updates the active display tab or pane title plus settings context immediately; debounced persistence continues independently and never delays the visible name."

  text-entry-memory:
    scope: [signal-settings, area-settings, screen-settings, axis-limits, settings-search, signal-add-search, signal-operation]
    attributes: {autocomplete: off, spellcheck: false, autocapitalize: off, autocorrect: off, semantic_name_attribute: absent}
    browser_profile_suggestions: forbidden

  signal-colors:
    palette: ["#2563eb", "#dc2626", "#16a34a", "#9333ea", "#ea580c", "#0891b2", "#ca8a04", "#db2777"]
    default_assignment: "Every automatically assigned signal color is selected from this exact ordered palette; no default color outside this list."
    picker_identity: "The color picker exposes the same exact ordered values, byte-for-byte and case-normalized."

tables:
  - id: signals-table
    tab: signals
    columns: [name, color, sample_rate, sample_count, duration, data_type]
    checkbox_semantics: "checked means membership/visibility in active pane; direct checkbox never changes main_signal"
    main_signal_semantics:
      selector: "[data-main-signal='true'].is-main-signal"
      cardinality: "zero_or_one; independent of checked membership, so current main may be hidden"
      persistent_fill: row-selected-analytical
      settings_context: signal
    ordinary_row_semantics:
      default_fill: surface
      hover_fill: row-hover
      checked_fill: surface
    mutation_continuity:
      identity: "row keyed by stable signal id; existing tbody/row/checkbox DOM is retained while a membership or main-signal mutation is pending"
      busy_projection: "set aria-busy on the table region and disable the same visible checkbox in place"
      forbidden: [replace_checkbox_with_spinner, remove_checked_row_during_pending, recreate_tbody_for_pending_only, hide_checkbox]
    plain_row_click:
      effect: "set main_signal to the clicked row and ensure its checkbox/membership is ON; never toggle OFF"
      excluded_targets: [checkbox, row_actions, buttons, links, form_controls, contenteditable, plotly_modebar]
    row_actions:
      - {id: duplicate-signal, icon: copy.svg, tooltip: "Дублировать сигнал"}
      - {id: signal-operation, icon: function.svg, tooltip: "Операция над сигналом", testid_pattern: "signal-operation-{name}"}
      - {id: delete-signal, icon: trash.svg, tooltip: "Удалить сигнал"}
  - id: measurements-table
    tab: measurements
    columns: [name, color, region_start, region_end, minimum, minimum_position, maximum, maximum_position, mean, median, peak_to_peak, rms]
    visibility_menu: "Columns may be hidden in the table, but the Signal Summary always retains all values."
    alignment: {name: left, color: left}
  - id: spectrum-extrema-table
    tab: peaks
    columns: [number, signal, color, type, magnitude, frequency, marker]
    coordinate_projection: "frequency displayed in the pane-selected unit"
  - id: main-signal-samples-table
    tab: dynamic-main-signal
    tab_label: main_signal.name
    columns:
      - {id: sample-index, label: "№ точки", alignment: left, width: "auto 1%", min_width_px: 112, cell_order: [point_number, optional_time_extrema_marker]}
      - {id: time, label: "Время"}
      - {id: value, label: "Значение"}
      - {id: magnitude, label: "Модуль", optional: true, default_visible: false, provider_field: magnitude}
      - {id: square, label: "Квадрат", optional: true, default_visible: false, provider_field: square}
      - {id: signed-square-root-magnitude, label: "Корень из модуля × знак", optional: true, default_visible: false, provider_field: signed_square_root_magnitude}
    base_columns:
      ids: [sample-index, time, value]
      visibility: always_visible_not_listed_in_menu
    calculated_columns:
      ids: [magnitude, square, signed-square-root-magnitude]
      order_fixed: true
      source: provider_authored_only
      ui_calculation_forbidden: true
      default_visibility: all_hidden
    visibility_menu:
      trigger: {testid: sample-columns-menu-trigger, selector: "[data-testid='sample-columns-menu-trigger']", class: inspector-action, icon: more-vertical.svg, row: samples-point-search-row, placement: final_end_slot, aria_haspopup: menu, aria_controls: sample-columns-menu}
      popup: {testid: sample-columns-menu, selector: "[data-testid='sample-columns-menu']", title: "Видимость столбцов", role: menu, width_px: 244, portal: body, position: anchored_to_trigger_end, viewport_gap_px: 8, flips_above_when_needed: true}
      items: {role: menuitemcheckbox, selector: "[data-sample-column-visible]", visible_icon: eye.svg, hidden_icon: eye-off.svg, toggles_without_closing: true}
      focus: {open: first_item, after_toggle: same_item, escape_close: trigger, outside_close: unchanged, tab_close: natural_document_order}
      keyboard: [trigger_enter, trigger_space, trigger_arrow_down, arrow_up_wrap, arrow_down_wrap, home, end, enter_toggle, space_toggle, escape]
      closes_on: [escape, tab, outside_click, trigger_repeat, inspector_page_change]
      table_reflow: "remove/add only the selected optional header/cells in fixed canonical order; base columns and current row-window/scroll offsets remain unchanged"
      preference_scope: frontend_only_shared_across_dynamic_values_tabs_for_application_lifetime
    product_dependencies:
      multiply: "unresolved multiplier input/default/scope and result-column identity; absent from ready menu"
      custom: "unresolved operation body/naming/lifecycle and result-column identity; absent from ready menu"
      square_root: "removed from the Values UI and menu; a backend field may remain unused"
      fft: "explicitly excluded"
    loading: sliding_bidirectional_row_window
    lifecycle: "tab exists/rebinds and first page loads automatically whenever valid main_signal exists; Values always selects/focuses it, expands the inspector from collapsed state, and starts page 1 when rows are missing"
    absent_when: no_main_signal
    row_window:
      api_batch_rows: 500
      max_dom_rows: 1000
      prefetch_threshold_rows: 100
      offset_convention: "provider start_offset/end_offset are authoritative zero-based half-open offsets; visible footer projects start_offset + 1 through end_offset"
      initial_sequence: ["1–500", "1–1000"]
      downward_shift: "append [1000,1500), drop the oldest 500, retain [500,1500), then subtract the measured removed-row height from scrollTop"
      upward_shift: "prepend [0,500), drop the newest 500, retain [0,1000), then add the measured prepended-row height to scrollTop"
      request_guards: [stable_signal_id, stable_window_token, one_in_flight_request_per_direction]
      total_scale: "100000000+; never allocate by total"
    point_search:
      placeholder: "Введите номер точки"
      input: {type: search, inputmode: numeric, exact_syntax: nonnegative_integer, range: "0..total-1", testid: sample-point-search-input}
      trigger: [enter]
      centered_start: "clamp(target - 250, 0, max(0, total - 500)); target is the entered zero-based sample_index"
      result: "replace current rows with authoritative page, focus target row and scroll it to center without selection/highlight"
      clear: "clearing alone clears value/validation and sends no request; explicit empty Enter resets first 500 rows and scrolls top"
      status: {position: inline_right, role: alert, aria_live: assertive, states: [invalid_syntax, out_of_range, provider_error], persistent_success: forbidden, compact: true, testid: sample-point-search-status}
      forbidden: [standalone_search_action, persistent_success_status, client_row_scan, full_payload, eager_reset_on_clear]
    time_extrema_marker:
      eligibility: "record.displayId/record.paneId equal exact active display/pane; plot type TIME; calculated true; pending false; no error; row.signal_name matches selected signal via existing signalNameMatches (exact fallback); row.sample_index present"
      color: row.signal_color
      projection: "point number first at left, then existing .extrema-table-marker triangle/color/graph_number"
      multiple: "one marker only: lowest finite graph_number; provider response order breaks ties"
      spectrum_bins_to_raw_samples: forbidden
      record_revision_equality_required: false
    prototype_fixture: {page_size: 500, pages_exercised: 4, total: 100000001, ranges: ["1–500", "1–1000", "501–1500", "1–1000"]}
    full_array_in_state_or_dom: false
    footer: {exact_text: "{start}–{end} из {total}", range: real_one_based_inclusive, source: authoritative_window_offsets}

  - id: engee-add-signal-catalog
    dialog: signal-add
    checkbox_semantics: "checked means selected for addition"
    mutation_continuity:
      identity: "once catalog rows are visible, rows and checkbox nodes stay mounted through refresh and submit loading"
      busy_projection: "dialog/list receives aria-busy and existing checkbox/search/action controls become disabled in place"
      initial_empty_loading: "loader may replace the empty list only before the first catalog rows exist"
      forbidden: [replace_visible_rows_with_loader, clear_checked_state_during_refresh, hide_checkbox, recreate_checkbox_for_busy_only]

graphs:
  - id: time-plot
    pane_type: time
    axes: [time, amplitude]
    sliders: [time-range, amplitude]
    legend: overlay_inside_plot
    hover_label: absent
    extrema_scope: current_visible_x_interval
  - id: spectrum-plot
    pane_type: spectrum
    axes: [frequency, magnitude]
    sliders: [spectrum-frequency, spectrum-magnitude]
    extrema_markers: present
    marker_positions: projected_frequency
    legend: overlay_inside_plot
    hover_label: absent
    extrema_scope: current_visible_frequency_interval
  - id: spectrogram-plot
    pane_type: spectrogram
    axes: [time, frequency]
    axis_types: {time: linear, frequency: provider_effective_linear_or_log}
    heatmap_color_range: unchanged_by_autoscale
    legend: not_applicable
    hover_label: absent
  - id: persistence-plot
    pane_type: persistence
    axes: [frequency, power]
    axis_types: {frequency: provider_linear_or_log, power: linear}
    heatmap_color_range: unchanged_by_autoscale
    legend: not_applicable
    hover_label: absent
  - id: plot-autoscale-contract
    trigger: double_click_on_clicked_ready_plot_surface
    baseline_capture: "after each accepted current Plotly.react; explicit provider axis range wins, otherwise capture the rendered automatic full-domain range"
    supported_plot_types: [time, spectrum, spectrogram, persistence]
    type_semantics:
      time: {x: "time in current projected unit, linear", y: "amplitude, linear"}
      spectrum: {x: "frequency in current projected unit, preserve linear/log", y: "current magnitude/power projection"}
      spectrogram: {x: "time in current projected unit, linear", y: "frequency in current projected unit, preserve effective linear/log"}
      persistence: {x: "frequency in current projected unit, preserve linear/log", y: "power in current projection, linear"}
    log_range_rule: "reuse provider/Plotly range coordinates exactly; never treat log range endpoints as raw linear frequency values"
    isolation: "relayout clicked pane only; no linked-pane propagation, settings publication, backend/DSP request, main_signal change or heatmap color-range reset"

