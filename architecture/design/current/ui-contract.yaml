    actions: [cancel, create-signal, close]
    states: [default, menu_open, custom, busy, error, success]
    custom_copy: "Код выполняется в Engee. Входной сигнал доступен как init_signal; результатом должно быть выражение, возвращающее новый вектор."
    custom_integration: "UI sends only the user operation body. Backend provider owns engee.genie.recv execution envelope, temporary binding and cleanup; none is generated or rendered by UI."
    operation_select_contract:
      component: SignalAnalyserValueSelect
      closed: "readonly selected-value input plus 24px down arrow"
      open: "same editable input, placeholder Поиск, 24px up arrow"
      popup: "options-only; no search row; border/padding 0; width equals anchor border-box except viewport clamp"
      option_height: 34
      selected_check: true
      closes_on: [selection, escape, tab, outside_click]
      modal_owned: true
  - id: signal-trim
    trigger: "eligible active Time-pane header action immediately before plot-type selector/overflow"
    testid: signal-trim-dialog
    width: 660
    title: "Обрезать сигнал по курсорам"
    fields:
      - {id: source, label: "Исходный сигнал", type: readonly_text}
      - {id: interval, label: "Интервал курсоров", type: readonly_text, boundary: inclusive, order: sorted}
      - {id: target-name, label: "Имя нового сигнала", type: text, required: true, autocomplete: off, max_length: 128}
      - {id: overwrite, label: "Затирать сигнал с таким именем", type: standard_checkbox_row, checkbox_size: 16, label_clipping: forbidden}
    actions: [cancel, create, close]
    states: [default, name_invalid, busy, conflict, unavailable_source, empty_interval, provider_error, success]
    focus: {open: target-name, trapped: true, escape_while_idle: close_and_restore_trigger, close_while_busy: blocked, success: close_without_return_focus}
    semantics: "inclusive samples between sorted X1/X2; preserve source sample rate and data type; returned signal time origin is zero; original signal remains unchanged"

