    settings_or_revision_mutation_forbidden: true
    backend_or_dsp_request_forbidden: true
    main_signal_mutation_forbidden: true
    heatmap_color_range_mutation_forbidden: true
    event_isolation: {graph_surface: plot_autoscale_only, visible_in_plot_slider: local_slider_reset, settings_range: local_field_auto_reset}
    forbidden_side_effects: [enable_slider, disable_slider, open_slider, open_pane_menu, settings_page_change]
  - id: settings-tab-activation-continuity
    ui_contract: "Every visible Settings tab activates synchronously even while a previous settings autosave/apply is pending; late prior completion cannot replace the selected page."
    helper: frontend-source/integration/js/task-0153-ui-regressions.js
    production_consumer: public/js/app.js
    host: "[data-testid='settings-tabs']"
    stable_selectors: ["[data-testid='settings-tab-display']", "[data-testid='settings-tab-screen']"]
    background_apply_continues: true
    disabled_by_apply_forbidden: true
  - id: contextual-footer-primary-actions
    ui_contract: "Значения and Рассчитать use canonical Primary MD blue styling without changing footer placement or action semantics."
    styles: frontend-source/integration/css/task-0153-ui-regressions.css
    helper: frontend-source/integration/js/task-0153-ui-regressions.js
    hosts: ["[data-testid='signal-values-action']", "[data-testid='extrema-values']"]
    variant: {name: primary_md, height: 32, radius: 6, fill: accent, text: surface, states: [default, hover, pressed, focus_visible, disabled]}
  - id: sample-time-extrema-markers
    ui_contract: "reuse active record.displayId/paneId calculated TIME rows; filter row.signal_name with existing signalNameMatches (exact fallback), use row.sample_index and row.signal_color, render number then one canonical marker; lowest finite graph_number wins; never Spectrum bins"
    helper: frontend-source/integration/js/task-0135-sample-search-markers.js
    production_consumer: public/js/app.js
    hosts: ["[data-inspector-content]", ".sample-table"]
  - id: optimistic-name-preview
    ui_contract: "display.name input -> selected tab/context in the same frame; pane.name input -> active pane title/context in the same frame; autosave remains authoritative"
    mock_provider: frontend-source/js/ui/app.js
    production_consumer: public/js/app.js
    hosts: ["[data-setting-id='display.name']", "[data-setting-id='pane.name']", "[data-display-select]", "[data-pane-id]", "[data-settings-context]"]
  - id: input-history-opt-out
    ui_contract: "all text/search/numeric settings and dialog inputs use autocomplete=off plus spellcheck/autocapitalize/autocorrect off and no semantic name; browser profile suggestions are forbidden"
    mock_provider: frontend-source/integration/js/task-0126-summary-units-continuity.js
    production_consumers: [public/js/settings.js, public/js/app.js]
  - id: axis-limit-projection
    ui_contract: "visible time/frequency limits use selected units while provider/state remain canonical seconds/Hz; empty bounds are never materialized"
    mock_provider: frontend-source/integration/js/task-0126-summary-units-continuity.js
    production_consumers: [public/js/settings.js, public/js/app.js]
    host: "[data-setting-id$='limits'][data-range-part]"
  - id: checkbox-mutation-continuity
    ui_contract: "keep stable signal-table and Engee-catalog checkbox nodes/checked state mounted during pending operations; disabled plus aria-busy are the only busy projection"
    mock_provider: frontend-source/integration/js/task-0126-summary-units-continuity.js
    production_consumer: public/js/app.js
    hosts: ["[data-signal-rows]", "[data-testid='signal-add-variables']"]
  - id: viewport-extrema-provider
    ui_contract: "read current visible Plotly X range for the active pane, convert and send optional visible_range canonical TIME {min_s,max_s} or SPECTRUM {min_hz,max_hz}; calculate extrema only inside it; absent means full domain and Y range is ignored"
    mock_provider: frontend-source/integration/js/task-0126-summary-units-continuity.js
    production_consumers: [public/js/app.js, public/js/api.js]
    host: "[data-pane-host]"
  - id: repeatable-viewport-extrema
    ui_contract: "keep the existing Settings/footer action; in Inspector project ready/stale-ready rows into a final 64px table-header action cell, and project idle/cleared/empty/error/pending into one centered white no-table surface; only pending disables the same Рассчитать button; every non-pending activation reads the current active-pane X viewport; provider polling belongs to immutable display/pane context"
    helper: frontend-source/integration/js/task-0162-extrema-retry.js
    production_consumers: [public/js/app.js, public/js/api.js]
    hosts: ["[data-testid='extrema-values']", "[data-testid='extrema-table-actions']", "[data-testid='extrema-calculate']", "[data-inspector-content]", "[data-settings-content]"]
    labels: {idle: "Рассчитать", error: "Рассчитать ещё раз", ready: "Пересчитать", empty: "Пересчитать", pending: "Рассчитывается…"}
    ready_empty_tooltip: "Пересчитать для актуальных диапазонов"
    settings_navigation_during_pending: enabled
    provider_context_key: "display_id::pane_id"
    disabled_only_when: pending
    current_viewport_read_timing: activation
    provider_empty_signal_policy: zero_rows_not_error
    replacement_forbidden: true
  - id: pane-owned-extrema
    ui_contract: "read current pane extrema by stable SignalId; project markers on every plot construction independently of inspector selection; clear only this pane through the Settings secondary action or the ready-table trash action"
    helper: frontend-source/integration/js/task-0165-pane-extrema-clear.js
    production_consumers: [public/js/app.js, public/js/api.js]
    hosts: ["[data-pane-host]", "[data-testid='extrema-clear']", "[data-testid='extrema-table-clear']", "[data-inspector-content]"]
    provider_state_fields: [extrema_by_signal, is_extrema_ready, success, error, need_update]
    extrema_item_fields: [sample, x, y, is_maximum]
    stable_signal_identity_required: true
    active_tab_dependency_forbidden: true
    clear_confirmation_forbidden: true
    clear_other_panes_forbidden: true
  - id: signal-operation-provider
    ui_contract: "send the typed preprocessing-only envelope with visible parameters plus the derived internal frequency_units value for filter operations; frequency_units has no rendered row and is projected only through the affected parameter labels; backend owns confirmed EngeeDSP execution and four required provider guards; provider/runtime failures project through signal-operation-error-alert, never inline raw text"
    mock_provider: mock/mock-provider.js
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    portal: body
    failure_projection: {component: signal-operation-error-alert, busy_ends_before_open: true, preserved_form: true, raw_error: forbidden}
  - id: signal-operation-single-trigger
    ui_contract: "Only signal-operation-type renders one button[role=combobox] containing decorative operation icon, label span and decorative arrow span; no nested input/button. Existing body popup, ten option buttons/icons, selection, keyboard navigation, outside close and focus restoration target the outer trigger."
