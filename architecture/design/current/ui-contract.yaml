  - id: autoscale-clicked-plot
    trigger: {element: ready-plot-host-graph-surface, action: double_click}
    visible_result: "only the clicked Time/Spectrum/Spectrogram/Persistence pane returns to its current output's authoritative default/full-domain X and Y ranges; current units and linear/log semantics remain unchanged; pane-slider visibility is read-only and an initially hidden horizontal pane slider stays unmounted"
    seam: pane-plot-autoscale
  - id: edit-or-apply-settings-range-with-pane-sliders-off
    trigger: {element: settings-range-number-or-apply-lifecycle, action: input_change_or_apply}
