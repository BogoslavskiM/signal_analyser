production_integration_contract:
  mode: additive_only
  immutable_document: public/index.html
  invariant_module_identities: [public/js/app.js, public/js/settings.js, public/js/api.js, public/js/value-select.js]
  module_rule: "extend existing render/provider seams in place; never replace a module or its bootstrap"
  immutable_shell_selectors: ["[data-testid='app-shell']", "[data-testid='display-workspace']", "[data-testid='settings-panel']", ".inspector"]
  immutable_plot_host_selector: "[data-pane-host]"
  plot_host_rule: "use the existing Plotly queue/react/relayout and amplitude-slider path; never assign host innerHTML or replace its children"
  body_modal_portal: body
  transferable_sources:
    - frontend-source/integration/css/task-0112-0115-additions.css
    - frontend-source/integration/css/task-0116-refinements.css
    - frontend-source/integration/js/task-0117-signal-row-intent.js
    - frontend-source/integration/css/task-0118-color-picker.css
    - frontend-source/integration/js/task-0118-color-picker.js
    - frontend-source/integration/js/task-0119-context-and-samples-intent.js
    - frontend-source/integration/js/task-0126-summary-units-continuity.js
    - frontend-source/integration/css/task-0130-graph-cursors.css
    - frontend-source/integration/js/task-0130-graph-cursors.js
    - frontend-source/integration/js/task-0134-sample-row-window.js
    - frontend-source/integration/css/task-0135-sample-search-markers.css
    - frontend-source/integration/js/task-0135-sample-search-markers.js
    - frontend-source/integration/css/task-0138-values-columns.css
    - frontend-source/integration/js/task-0138-values-columns.js
    - frontend-source/integration/js/task-0139-ui-inventory.js
    - frontend-source/integration/css/task-0139-loading-overlays.css
    - frontend-source/integration/js/task-0139-loading-overlays.js
