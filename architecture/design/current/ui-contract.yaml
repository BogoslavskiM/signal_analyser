  - {id: settings-magnitude-slider, zone: display-settings, type: checkbox, label: "Слайдер магнитуды", field: show-magnitude-slider, states: [default, hover, checked, disabled, focus_visible]}
  - {id: inspector-up, zone: lower-inspector, type: icon_button, label: "Развернуть нижнюю зону", testid: inspector-state-up, tooltip: {enabled: true, delay_ms: 1500, text: "Развернуть нижнюю зону"}, states: [default, hover, pressed, focus_visible]}
  - {id: inspector-down, zone: lower-inspector, type: icon_button, label: "Свернуть нижнюю зону", testid: inspector-state-down, tooltip: {enabled: true, delay_ms: 1500, text: "Свернуть нижнюю зону"}, states: [default, hover, pressed, focus_visible]}
  - {id: signal-main-group, zone: display-settings, type: disclosure, label: "Основное", selector: "[data-signal-settings-group-toggle='main']", states: [expanded, hover, pressed, focus_visible, collapsed]}
  - {id: signal-summary-group, zone: display-settings, type: disclosure, label: "Сводка", selector: "[data-signal-settings-group-toggle='summary']", states: [expanded, hover, pressed, focus_visible, collapsed]}
  - {id: signal-color-trigger, zone: display-settings, type: color_button, label: "Выбрать цвет", selector: ".settings-panel .color-swatch-button", states: [default, hover, focus_visible, expanded]}
  - {id: signal-sample-rate, zone: display-settings, type: editable_metadata_numeric, label: "Дискретизация, Гц", selector: "[data-signal-metadata='sample_rate_hz']", validation: positive_finite_dot_decimal, states: [default, focus_visible, dirty, invalid, applying]}

interactions:
  - id: signal-row-membership-and-main
    trigger: {element: signals-table-row-noncontrol-surface, action: click}
    visible_result: "clicked row becomes sole blue main_signal and its checkbox is ON; an already checked row stays checked"
    seam: signal-membership-main
  - id: signal-checkbox-visibility-only
    trigger: {element: signals-table-visibility-checkbox, action: change}
    visible_result: "only that graph trace/membership is added or removed; blue main_signal remains unchanged even when its checkbox becomes OFF"
    seam: signal-membership-main
  - id: signal-settings-group-collapse
    trigger: {element: signal-main-group-or-signal-summary-group, action: click_or_keyboard}
    visible_result: "only the selected group body hides/shows; standard disclosure arrow and settings scroll owner remain"
    seam: signal-settings-disclosure
  - id: pane-focus-area-settings
    trigger: {element: plot-pane-noncontrol-surface, action: click}
    visible_result: "clicked pane becomes active and the right panel selects Область with updated pane context"
    seam: settings-context-routing
  - id: pane-type-focus-area-settings
    trigger: {element: pane-type-dropdown-option, action: select}
    visible_result: "after accepted pane mutation, Область is selected and Signal content is removed from the settings content owner"
    seam: settings-context-routing
  - id: display-focus-screen-settings
    trigger: {element: display-tab-or-add-display, action: click}
    visible_result: "selected/new display becomes active and the right panel selects Экран with updated display context"
    seam: settings-context-routing
  - id: signal-values-focus
    trigger: {element: signal-values, action: click}
    visible_result: "the named main_signal tab is guaranteed, selected and focused; a collapsed inspector expands and a missing first page starts loading into the base-plus-optional-column table"
    seam: signal-samples-provider
  - id: automatic-main-signal-samples
    trigger: {element: main-signal-state, action: available_or_changed}
    visible_result: "one named sample tab exists/rebinds and its first populated base-plus-optional-column page loads without stealing inspector focus"
    seam: signal-samples-provider
  - id: bidirectional-main-signal-sample-window
    trigger: {element: samples-table-scroll, action: scroll_within_100_rows_of_window_boundary}
    visible_result: "existing visible-column rows extend to 1000, then slide by 500 in either direction without moving the currently visible record; footer shows the exact real one-based range"
    seam: signal-samples-provider
  - id: jump-to-main-signal-point
    trigger: {element: sample-point-search-input, action: enter}
    visible_result: "replace with centered 500-row server page, focus/center-scroll the exact zero-based target row, leave no success message, then resume ordinary sliding; only a compact error may remain inline"
    seam: signal-samples-provider
  - id: project-time-extrema-into-sample-index
    trigger: {element: samples-table-render, action: current_active_time_extrema_available}
    visible_result: "point number remains first/left; one deterministic canonical marker follows it; Spectrum extrema never appear"
    seam: sample-time-extrema-markers
  - id: open-sample-column-visibility
    trigger: {element: sample-columns-menu-trigger, action: click_or_enter_space_arrow_down}
    visible_result: "244px Видимость столбцов menu anchors to the three-dot trigger, flips above when needed and focuses its first eye row"
    seam: signal-sample-calculated-columns
  - id: toggle-sample-calculated-column
    trigger: {element: sample-column-visibility-item, action: click_or_enter_space}
    visible_result: "the selected optional header/cells appear or disappear immediately in fixed order; eye/eye-off updates, menu stays open and focus remains on that row"
    seam: signal-sample-calculated-columns
  - id: close-sample-column-visibility
    trigger: {element: sample-columns-menu, action: escape_tab_outside_or_trigger_repeat}
    visible_result: "Escape restores trigger focus; outside click closes without stealing its target focus; table selection/window/scroll remain unchanged"
    seam: signal-sample-calculated-columns
  - id: signal-color-draft
    trigger: {element: signal-color-trigger, action: click}
    visible_result: "284px HEX + original eight-color palette popover; selection previews nested draft and Apply updates only the Signal page draft"
    seam: signal-color-draft
  - id: signal-sample-rate-edit
    trigger: {element: signal-sample-rate, action: input_then_autosave}
    visible_result: "valid positive finite dot-decimal draft persists; comma/nonfinite/zero/negative stays invalid"
    seam: settings-autosave-provider
  - id: validate-range-boundaries
    trigger: {element: applicable-area-or-screen-range-input, action: input_or_unit_projection}
    visible_result: "Min and Max are validated independently and each invalid input receives only its own red border; one inline message shows the Min error first, then the Max error after Min is fixed"
    seam: range-boundary-validation
    valid_result: "blank Auto or valid projected viewport value remains enabled and relayouts Plotly only; no settings/API publication"
  - id: toggle-spectrum-frequency-link
    trigger: {element: link-spectrum-frequency, action: change}
    visible_result: "same frequency limits component moves Area <-> Screen immediately without value loss"
    seam: linked-axis-draft
  - id: toggle-spectrum-magnitude-link
    trigger: {element: link-spectrum-magnitude, action: change}
    visible_result: "same magnitude limits component moves Area <-> Screen immediately without value loss"
    seam: linked-axis-draft
  - id: show-spectrum-extrema
    trigger: {element: show-extrema-values, action: click}
    visible_result: "calculation uses only the active plot's current visible X/frequency interval, then the Extrema tab is selected and plot markers remain visible"
    seam: spectrum-extrema-provider
  - id: calculate-time-extrema-in-visible-zoom
    trigger: {element: show-extrema-values, action: click}
    visible_result: "calculation uses only the active time plot's current visible X interval; Y zoom never constrains extrema"
    seam: viewport-extrema-provider
  - id: toggle-spectrum-frequency-slider-from-menu
    trigger: {element: pane-menu-frequency-slider, action: click}
    visible_result: "horizontal spectrum slider and Area checkbox update from the same active-pane state"
    seam: pane-slider-visibility
  - id: toggle-spectrum-frequency-slider-from-settings
    trigger: {element: settings-frequency-slider, action: change}
    visible_result: "horizontal spectrum slider and pane-menu aria-checked update from the same active-pane state"
    seam: pane-slider-visibility
  - id: toggle-spectrum-magnitude-slider-from-menu
    trigger: {element: pane-menu-magnitude-slider, action: click}
    visible_result: "vertical spectrum slider and Area checkbox update from the same active-pane state"
    seam: pane-slider-visibility
  - id: toggle-spectrum-magnitude-slider-from-settings
    trigger: {element: settings-magnitude-slider, action: change}
    visible_result: "vertical spectrum slider and pane-menu aria-checked update from the same active-pane state"
    seam: pane-slider-visibility
  - id: toggle-single-graph-cursor
    trigger: {element: pane-menu-single-cursor, action: click}
    visible_result: "off/dual -> one snapped draggable vertical cursor; selecting Курсор again -> off; menu closes and its check projects pane-local mode"
    seam: pane-graph-cursors
  - id: toggle-dual-graph-cursors
    trigger: {element: pane-menu-dual-cursor, action: click}
    visible_result: "off/single -> two snapped draggable vertical cursors with X1, X2, ΔX and per-visible-trace Y1/Y2; selecting Два курсора again -> off"
    seam: pane-graph-cursors
  - id: drag-or-keyboard-move-graph-cursor
    trigger: {element: graph-cursor-line, action: pointer_drag_or_arrow_home_end}
    visible_result: "cursor stays inside current visible X domain, snaps to nearest available X sample/bin (including finite X=0 across heterogeneous traces) and updates only this pane readout without starting Plotly zoom or axis linking"
    seam: pane-graph-cursors
  - id: reconcile-cursor-after-plot-relayout
    trigger: {element: plot-host, action: plotly_relayout_or_plot_refresh}
    visible_result: "each existing cursor remains when possible; an out-of-domain cursor clamps to the new nearest visible sample/bin; linked axes never copy cursor mode or position across panes"
    seam: pane-graph-cursors
  - id: open-measurement-column-visibility
    trigger: {element: measurement-columns-menu-trigger, action: click_or_enter_space_arrow_down}
    visible_result: "existing 244px Видимость измерений menu anchors to the standard three-dot trigger; one flat list shows existing measurement rows first, then X1/Y1/X2/Y2/ΔX/ΔY with eye/eye-off and current disabled eligibility; no Видимость столбцов subgroup title is rendered"
    seam: measurement-cursor-columns
  - id: toggle-measurement-cursor-column
    trigger: {element: enabled-measurement-cursor-column-item, action: click_or_enter_space}
    visible_result: "selected eligible cursor column appears/disappears immediately at the end of the Measurements table; eye state updates, menu remains open and row focus is retained"
    seam: measurement-cursor-columns
  - id: reconcile-measurement-cursor-columns
    trigger: {element: active-pane-cursor-controller, action: mode_or_position_change}
    visible_result: "off hides/disables all; single permits X1/Y1; dual permits all six; any now-ineligible visible column disappears immediately while pane-local intent remains latent"
    seam: measurement-cursor-columns
  - id: update-measurement-cursor-values
    trigger: {element: graph-cursor-line, action: pointer_drag_keyboard_move_or_plot_reconcile}
    visible_result: "visible coordinate cells update in place for every matching measurement row with current axis units and signed ΔX/ΔY"
    seam: measurement-cursor-columns
  - id: toggle-axis-labels
    trigger: {element: settings-show-axis-labels, action: change}
    visible_result: "axis and applicable colorbar title text clears or restores immediately for the active pane; axes, ticks, grid, colorbar, margins and data stay mounted"
    seam: pane-axis-labels-and-hover-policy
  - id: suppress-native-plotly-hover
    trigger: {element: accepted-plot-payload-or-overlay-trace, action: before_plotly_react_or_after_overlay_add}
    visible_result: "no unified-X/closest Plotly tooltip or hover popover is rendered on any plot type while zoom/pan/cursors/readouts remain interactive"
    seam: pane-axis-labels-and-hover-policy
  - id: open-cursor-trim
    trigger: {element: pane-trim-signal, action: click_or_enter_space}
    visible_result: "existing-style modal opens with source and sorted inclusive cursor interval read-only, empty required target name focused and overwrite unchecked"
    seam: cursor-trim-signal
  - id: submit-cursor-trim
    trigger: {element: signal-trim-create, action: click}
    visible_result: "valid submit keeps every control node/value visible while busy; typed recoverable error stays open; success closes only after the returned signal appears in Signals"
    seam: cursor-trim-signal
  - id: autoscale-clicked-plot
    trigger: {element: ready-plot-host-graph-surface, action: double_click}
    visible_result: "only the clicked Time/Spectrum/Spectrogram/Persistence pane returns to its current output's authoritative default/full-domain X and Y ranges; current units and linear/log semantics remain unchanged"
    seam: pane-plot-autoscale
  - id: open-operation
    trigger: {element: signal-operation, action: click}
    visible_result: signal-operation
    seam: signal-operation-provider
  - id: autosave-settings
    trigger: {element: any-valid-visible-persisted-setting-excluding-viewport-range-mirrors, action: input_or_change}
    visible_result: "debounced serialized save and publication; no general Apply control"
    seam: settings-autosave-provider
  - id: optimistic-display-name
    trigger: {element: display-name, action: input}
    visible_result: "active screen tab and settings context update on the same frame, before autosave settles"
    seam: optimistic-name-preview
  - id: optimistic-pane-name
    trigger: {element: pane-name, action: input}
    visible_result: "active pane title and settings context update on the same frame, before autosave settles"
    seam: optimistic-name-preview
  - id: selected-unit-limit-editing
    trigger: {element: axis-limit-units-or-number, action: select_or_input}
    visible_result: "nonempty Min/Max values and inline unit label use the selected axis unit; empty bounds remain empty placeholders"
    seam: axis-limit-projection
  - id: loading-preserves-checkbox
    trigger: {element: signal-membership-or-engee-add-submit, action: pending_mutation}
    visible_result: "the same checkbox remains visible with its checked state, disabled/aria-busy only; no loading replacement or blink"
    seam: checkbox-mutation-continuity
  - id: delete-and-add-display
    trigger: {element: display-close-and-add, action: click}
    visible_result: "remaining persisted names stay unchanged; new default uses next monotonic ordinal"
    seam: workspace-state-provider

dropdown_contract:
  settings_open_on: click
  settings_search_inside_control: false
  lmb_selection_closes_popup_and_sets_not_active: true
  lmb_selection_forces_dom_blur: false
  outside_canvas_click_closes_all: true
  another_dropdown_closes_previous: true

operation_menu_contract:
  component: SignalAnalyserValueSelect
  trigger: "click anywhere on selected-value field or its 24px arrow"
  closed: "readonly selected-value input plus down arrow"
  open: "same editable input with placeholder Поиск plus up arrow"
  popup: "options only; no separate search row; border/padding 0; anchor border-box width except viewport clamp"
  option_height: 34
  selected_check: true
  closes_on: [selection, outside_click, escape, tab]
  keyboard: "ArrowUp/ArrowDown move active option; Enter selects; focus returns to anchor on Escape"
  stacking: modal_owned

dialog_contract:
  ordinary_close: [close_button, cancel_button, escape]
  backdrop_close: false
  busy_close: false
  destructive_close: not_applicable
  body_scroll: true
  fixed_parts: [titlebar, actions]

overlays:
  combinations:
    - id: plot-with-legend-cursors-and-sliders
      bottom_to_top: [plotly_graph, plotly_legend, plot_sliders, graph_cursor_layer, graph_cursor_readout]
      pointer_owner: "cursor line only while hovered/focused/dragged; otherwise Plotly graph"
      focus_owner: focused_cursor_or_plot
      inert_layers: []
      restore_target: pane-menu-trigger
    - id: pane-output-reconciliation
      bottom_to_top: [pane_header_and_plot, pane_output_loading_overlay]
      anchor: "exact [data-pane-id] pane, never [data-pane-host] descendants"
      trigger: "accepted pane-type mutation or valid Area settings commit that starts output refresh"
      terminal: "matching current output reaches ready, empty or error"
      pointer_owner: pane_output_loading_overlay
      pointer_cursor: standard
      focus_owner: unchanged_outside_pane
      inert_layers: [pane_header, plotly_graph, plot_controls, graph_cursor_layer]
      stale_completion: ignored
      animation: {keyframes: loader-rotate, duration_ms: 800, timing: linear, iteration: infinite, reduced_motion_duration_ms: 1600, static_forbidden: true}
      restore_target: unchanged
    - id: display-layout-reconciliation
      bottom_to_top: [display_plot_canvas, display_canvas_loading_overlay]
      anchor: "active display plot-grid canvas only; titlebar, display tabs/actions, settings and inspector remain outside"
      trigger: "layout add/remove pane or rows/columns mutation begins"
      terminal: "matching accepted layout plus every initial pane output reaches ready, empty or error"
      pointer_owner: display_canvas_loading_overlay
      pointer_cursor: standard
      focus_owner: unchanged_outside_canvas
      inert_layers: [all_panes_and_plot_controls]
      suppressed_layers: [pane_output_loading_overlay]
      stale_completion: ignored
      animation: {keyframes: loader-rotate, duration_ms: 800, timing: linear, iteration: infinite, reduced_motion_duration_ms: 1600, static_forbidden: true}
      restore_target: unchanged
    - id: settings-with-color-picker
      bottom_to_top: [application, settings_panel, signal_color_picker]
      pointer_owner: signal_color_picker
      busy_pointer_cursor: standard
      focus_owner: hex_then_swatches_then_footer
      inert_layers: []
      restore_target: signal-color-trigger
    - id: application-bootstrap-loading
      bottom_to_top: [application, application_bootstrap_overlay]
      anchor: "fixed viewport overlay using the existing .app-status singleton"
      trigger: "initial current-token state-lite/settings bootstrap begins"
      terminal: "current-token state-lite and active-display settings accepted plus initial render committed"
      pointer_owner: application_bootstrap_overlay
      pointer_cursor: standard
      focus_owner: retry_on_error_otherwise_status
      inert_layers: [application_shell]
      stale_completion: ignored
      animation: {keyframes: loader-rotate, duration_ms: 800, timing: linear, iteration: infinite, reduced_motion_duration_ms: 1600, static_forbidden: true}
      restore_target: unchanged
    - id: samples-with-column-visibility-menu
      bottom_to_top: [application, lower_inspector, sticky_table_header, sample_columns_menu]
      pointer_owner: "menu while pointer is inside; table/search elsewhere"
      focus_owner: "roving focused menu row; trigger after Escape"
      inert_layers: []
      restore_target: sample-columns-menu-trigger
      stacking: "var(--layer-dropdown); below color popover/dialog/modal and with tooltips suppressed while open"
    - id: pane-overflow-menu
      bottom_to_top: [application, pane_menu_body_portal]
      anchor: "clicked [data-pane-menu] in current pane header"
      boundary: "intersection([data-testid='app-shell'], viewport) inset 8px"
      placement: "prefer below/right-aligned; flip above/left; clamp only when neither side fits"
      reposition: [window_resize, capture_scroll]
      close_when: [anchor_disconnected, anchor_outside_boundary, outside_click, escape]
      pointer_owner: pane_menu_body_portal
      focus_owner: roving_menu_item
      restore_target: clicked_pane_menu_trigger
    - id: operation-with-dropdown
      bottom_to_top: [application, modal_backdrop, operation_dialog, operation_dropdown]
      pointer_owner: operation_dropdown
      focus_owner: active_option
      inert_layers: [application]
      restore_target: operation-select
    - id: operation-busy
      bottom_to_top: [application, modal_backdrop, operation_dialog, busy_status]
      pointer_owner: none
      focus_owner: operation_dialog
      inert_layers: [application, close, cancel, submit]
      restore_target: submit_or_error

e2e_visibility_contract:
  visible: true
  stable_selectors:
    viewport_range_row: "[data-setting-id$='limits']"
    viewport_range_slider: "[data-screen-range-slider]"
    viewport_generation: "[data-range-generation]"
    viewport_sync_state: "[data-range-sync-state]"
    viewport_preview_pane: "[data-pane-id][data-range-preview-active]"
    measurement_menu_trigger: "[data-testid='measurement-columns-menu-trigger']"
    measurement_menu: "[data-testid='measurement-columns-menu']"
    measurement_cursor_item: "[data-measurement-cursor-column]"
    measurement_cursor_cell: "[data-measurement-cursor-value]"
    axis_label_setting: "[data-testid='settings-show-axis-labels']"
    plot_host: "[data-pane-host]"
    trim_action: "[data-testid='pane-trim-signal']"
    trim_action_eligibility: "[data-pane-trim-eligible]"
    trim_layer: "[data-testid='signal-trim-layer']"
    trim_dialog: "[data-testid='signal-trim-dialog']"
    trim_name: "[data-signal-trim-name]"
    trim_overwrite: "[data-signal-trim-overwrite]"
    trim_submit: "[data-signal-trim-submit]"
    trim_cancel: "[data-signal-trim-cancel]"
    trim_close: "[data-signal-trim-close]"
    trim_status: "[data-signal-trim-status]"
  observable_assertions:
    - "range row/inputs/slider/handles/plot strictEqual before, during and after pointer drag"
    - "no pane or plot clientWidth/clientHeight/scrollWidth/scrollHeight/overflow change during viewport preview"
    - "no /api/settings, output or DSP request from viewport inputs/sliders/Plotly relayout/autorange"
    - "Plotly double-click sets true autorange and leaves corresponding inputs blank/full-domain handles after all queued work"
    - "measurement item disabled/visible state follows off/single/dual and cursor cells update without table remount"
    - "every .hoverlayer .hovertext count remains zero after pointer movement for all four plot types"
    - "axis checkbox changes title text only and persists once per pane without output request"
    - "trim action is absent/hidden for non-Time, off, single, missing-main or nonfinite context and visible only for eligible dual Time"
    - "trim modal controls retain strict node identity and values through pending; typed error stays open; success closes after Signals contains returned id"
  cleanup_hooks:
    range: "SignalAnalyserRangeLifecycle.clear(context) / clearPane(displayId,paneId)"
    cursor: "SignalAnalyserGraphCursorUI controller.clear(paneRuntimeKey) plus unsubscribe()"
    measurements: "SignalAnalyserMeasurementCursorColumns controller.clear(paneRuntimeKey)"
    titles: "SignalAnalyserAxisLabelsAndHover controller.clear(paneRuntimeKey)"
    trim: "SignalAnalyserCursorTrimSignal controller.destroy()"
  after_each: "close body portals; clear pane-scoped controllers/timers/subscriptions; restore cursor mode off and Plotly autorange; assert no trim/status/hover overlay leaks"

integration_seams:
  - id: signal-membership-main
    ui_contract: "row click ensures membership ON then selects main; direct checkbox changes membership only; blue main_signal is independent of visibility"
    mock_provider: "prototype/mock-fetch.js plus design-only prototype/task-0117-interaction-bridge.js"
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
    hosts: ["[data-signal-rows]", "[data-settings-content]"]
  - id: signal-settings-disclosure
    ui_contract: "Signal Основное/Сводка reuse standard settings-group disclosure and retain state for the active signal editor"
    mock_provider: "actual public/js/app.js rendered over deterministic provider fixture"
    production_consumer: public/js/app.js
    host: "[data-settings-content]"
  - id: signal-color-draft
    ui_contract: "HEX/original eight-color nested draft; popover Apply updates Signal editor draft only; Cancel/Escape/outside restore opening color"
    mock_provider: "frontend-source/integration/js/task-0118-color-picker.js plus prototype/task-0119-interaction-bridge.js"
    production_consumer: public/js/app.js
    host: "document.body + [data-settings-content]"
  - id: settings-context-routing
    ui_contract: "plain pane click or accepted plot-type mutation selects Area; display-tab/add-display selects Screen synchronously even while a prior settings apply is pending; late prior completion cannot replace the selected page; no shell/page remount"
    mock_provider: "actual public/js/app.js rendered over deterministic provider fixture"
    production_consumer: public/js/app.js
    hosts: ["[data-pane-id]", "[data-display-select]", "[data-testid='add-display']", "[data-settings-page]"]
  - id: workspace-state-provider
    ui_contract: "read/persist stable display/pane ids, names and monotonic default ordinals; name drafts preview in existing headers immediately"
    mock_provider: mock/mock-provider.js
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
  - id: settings-autosave-provider
    ui_contract: "Persisted Signal/Area/Screen fields autosave through one revision-safe queue; viewport range mirrors are explicitly excluded; Extrema settings save before explicit Рассчитать"
    mock_provider: mock/mock-provider.js
    production_provider: public/js/settings.js
    production_consumer: public/js/app.js
    host: "[data-settings-content] + [data-testid='settings-footer']"
    excluded_frontend_only_fields: [all_axis_limit_numeric_inputs, all_axis_limit_sliders]
    deprecated_interface: settings.publishRange
  - id: pane-slider-visibility
    ui_contract: "one active-pane x/y visibility draft projected synchronously into existing pane menu and settings checkboxes"
    mock_provider: frontend-source/js/ui/app.js
    production_provider: public/js/app.js
    settings_inventory: public/js/settings.js
    hosts: ["[data-plot-range-slider]", "[data-plot-amplitude-slider]", "[data-settings-content]", "[data-pane-host]"]
  - id: pane-graph-cursors
    ui_contract: "two existing-style pane-menu checks select one pane-local off/single/dual mode; vertical overlay cursors snap to visible X samples/bins and report X/ΔX plus visible-trace values"
    mock_provider: "frontend-source/integration/js/task-0130-graph-cursors.js plus prototype/task-0130-graph-cursors-bridge.js"
    production_provider: public/js/app.js
    frontend_state: "Map<paneRuntimeKey,{mode,values}>; never backend/session/state_revision"
    hosts: ["[data-testid='display-overflow-menu']", "[data-pane-host]", ".plot-canvas"]
    eligible_plot_types: [time, spectrum]
