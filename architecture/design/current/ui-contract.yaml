    testid: signal-operation-dialog
    width: 660
    title: "Операция над сигналом"
    fields:
      - {id: source, label: "Исходный сигнал", type: readonly_text}
      - {id: operation, label: "Операция", type: shared_value_select, implementation: SignalAnalyserValueSelect, options: [abs, square, sqrt, signed_sqrt_abs, multiply, custom], removed_options: [fft]}
      - {id: multiplier, label: "Множитель", type: numeric, visible_when: "operation=multiply"}
      - {id: custom-operation-body, label: "Тело операции", type: code_editor, visible_when: "operation=custom", input_name: init_signal}
