  production_baseline_evidence: evidence/production-baseline-v32.json
  required_nonempty_zone_slots: [toolbar, workspace, settings, inspector]
  forbidden: [fetch_html_partials, http_server, network_api, cors_dependency, alternative_mock_shell]
  browser_result: {inherited_checks: 52, delta_checks: 1, passed: 53, failed: 0, runtime_errors: 0, http_resources: 0}
  sample_window_result: {inherited_checks: 53, delta_checks: 1, passed: 54, failed: 0}
  sample_search_marker_result: {inherited_checks: 54, delta_checks: 2, passed: 56, failed: 0}
