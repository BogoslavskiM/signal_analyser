    selector: "[data-testid='signal-operation-select']"
    nested_interactive_elements: forbidden
    non_operation_value_selects: unchanged_searchable_input_trigger
  - id: signal-preprocess-provider
    ui_contract: "Every entry resolves the accepted plain-LMB main_signal by stable id at handling time, renders exactly the V59 ten-operation Engee-supported schema with the V61 unified semantic operation-icon projection, and creates a derived signal without changing its source. The external host command remains supported without adding another in-app control."
    helper: frontend-source/integration/js/task-0157-preprocess-operation.js
    production_provider: public/js/api.js
    production_consumer: public/js/app.js
