    production_provider: public/js/app.js
    settings_inventory: public/js/settings.js
    frequency: {eligible: [spectrum, persistence], excluded: [spectrogram], canonical_unit: hertz, mixed_linear_log: canonical_decode_then_target_encode}
    magnitude: {eligible: [spectrum_db, persistence_db], mapping: "spectrum.y_limits ↔ persistence.power_limits", ignored: [linear_scale, hidden_fields, spectrogram_power, persistence_density]}
