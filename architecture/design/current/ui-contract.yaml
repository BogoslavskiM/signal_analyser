      - {id: overwrite, label: "Затирать сигнал с таким именем", type: standard_checkbox_row, checkbox_size: 16, label_clipping: forbidden}
    actions: [cancel, create-signal, close]
    states: [preprocess_default, menu_open, conditional_fields, compatibility_message, busy, field_error, runtime_error_alert, success]
    operation_icons:
      mapping: {bandpass: operation-bandpass.svg, bandstop: operation-bandstop.svg, highpass: operation-highpass.svg, lowpass: operation-lowpass.svg, detrend: operation-detrend.svg, fill-missing: operation-fill-missing.svg, smooth: operation-smooth.svg, envelope: operation-envelope.svg, resample: operation-resample.svg, custom-preprocess: operation-custom.svg}
      semantic_matrix: {bandpass: central_plateau_low_edges, bandstop: central_notch_high_edges, highpass: left_to_right_rise, lowpass: left_to_right_fall, detrend: centered_wave_and_dashed_sloped_trend, fill-missing: broken_wave_dashed_bridge_and_point, smooth: angular_noise_and_smooth_line, envelope: carrier_under_upper_envelope, resample: one_curve_sparse_to_dense_points, custom-preprocess: function_fx}
      closed_trigger: {selector: "[data-testid='signal-operation-select'] [data-value-select-trigger-icon]", placement: inline_before_selected_text_inside_single_field_border, size_px: 16, left_padding_px: 12, text_gap_px: 8, detached_icon_cell: forbidden, internal_divider: forbidden}
      expanded_rows: {selector: "[data-value-select-popup] [data-value-select-option-icon]", placement: immediately_before_option_text_after_existing_check_slot, size_px: 16, text_gap_px: 8}
      accessibility: {element: img, alt: "", aria_hidden: true, text_accessible_name_preserved: true}
      invariants: [dialog_width_480, single_line_control_height_32, one_outer_border_owner, popup_anchor_width_unchanged, option_height_34_unchanged, popup_keyboard_focus_unchanged, trim_dialog_unchanged]
    entry:
      signal_operation_action: {operation: bandpass, source: current_accepted_plain_lmb_main_signal_by_stable_id}
      analyser_preprocess_action: {owner: external_engee_host_menu, target: window, event: "signal-analyser:host-command", detail: {command: preprocess}, application_dom_selector: none, visible_in_app_control: false, operation: bandpass, source: current_accepted_plain_lmb_main_signal_by_stable_id}
    preprocess_parameter_matrix:
      bandpass: [lower_passband, upper_passband, impulse_response, steepness, stopband_attenuation_db]
      bandstop: [lower_passband, upper_passband, impulse_response, steepness, stopband_attenuation_db]
      highpass: [passband, impulse_response, steepness, stopband_attenuation_db]
      lowpass: [passband, impulse_response, steepness, stopband_attenuation_db]
      detrend:
        always: [method, nan_policy]
        piecewise_linear: [breakpoints]
      fill_missing:
        always: [method, end_method]
        constant: [constant_value]
        moving_mean_or_median: [window_length]
        autoregressive: [ar_order]
      smooth:
        always: [method, window_type]
        duration: [duration_units, window_duration_nullable_auto]
        factor: [smoothing_factor_strictly_between_zero_and_one]
        savitzky_golay: [polynomial_degree_nullable_auto_default_two]
      envelope:
        always: [side, method]
        hilbert: []
        fir: [filter_order_positive_required]
        rms: [length_units, window_length_positive_required]
        peak: [separation_units, maxima_separation_positive_required]
      resample:
        uniform_rate: [mode, target_sample_rate_hz]
        uniform_factor: [mode, upsample_factor, downsample_factor]
        nonuniform: [target_sample_rate_hz, interpolation]
        no_time_metadata: compatibility_block
      custom_preprocess: [body]
    operation_system_functions:
      filters: [EngeeDSP.Functions.bandpass, EngeeDSP.Functions.bandstop, EngeeDSP.Functions.highpass, EngeeDSP.Functions.lowpass]
      detrend: [EngeeDSP.Functions.detrend]
      fill_missing: [EngeeDSP.Functions.interp1, EngeeDSP.Functions.movmean, EngeeDSP.Functions.movmedian, EngeeDSP.Functions.fillgaps]
      smooth: [EngeeDSP.Functions.smoothdata]
      envelope: [EngeeDSP.Functions.envelope]
      resample: [EngeeDSP.Functions.resample]
      custom_preprocess: [engee.genie.recv]
    absent_operations:
      denoise: "EngeeDSP.Functions.wdenoise and denoise are absent public symbols; no disabled row or fake output is shown."
      knn: "No public Engee KNN/fillmissing function or object was found; the former manual implementation is forbidden."
      former_math: [abs, square, sqrt, signed-sqrt, multiply, fft]
    automatic_values: "Only smooth window duration and Savitzky–Golay degree use blank Авто/null. FIR order, RMS window, peak distance and target sample rate are required and never present a fabricated automatic value."
    validation: "Only visible fields validate. Every invalid field owns its own 2px red border and local Russian message; compatibility is operation-level and sanitized runtime errors use the stacked alertdialog."
    capabilities: {supported_prod: [bandpass, bandstop, highpass, lowpass, detrend, fill-missing, smooth, envelope, resample, custom-preprocess], supported_contract: "141/141", inventory_gate: "51/51"}
    internal_derived_parameters:
      frequency_units: {visible_row: absent, state: preserved, payload: preserved_for_filters, derivation: "hertz when source sample rate is available; normalized_pi otherwise", visible_projection: "unit suffix in affected frequency-bound labels only"}
    provider_payload: [source_signal_id, operation_kind, operation, visible_parameters_plus_internal_derived_frequency_units, target_name, overwrite]
    custom_copy: "Код выполняется в Engee. Входной сигнал доступен как init_signal; результатом должно быть выражение, возвращающее новый вектор."
    custom_integration: "UI sends only the user operation body. Backend provider owns engee.genie.recv execution envelope, temporary binding and cleanup; none is generated or rendered by UI."
    operation_select_contract:
      component: SignalAnalyserValueSelect
      closed: "one button[role=combobox] containing decorative icon, selected text span and decorative 24px down arrow span"
      open: "the same outer button with up arrow; no nested input/button; trigger retains keyboard focus"
      popup: "options-only; no search row; border/padding 0; width equals anchor border-box except viewport clamp"
      option_height: 34
      selected_check: true
      closes_on: [selection, escape, tab, outside_click]
      modal_owned: true
    component_geometry:
      modal: {width: 480, header_height: 48, body_padding: 16, footer_height: 56, radius: 12}
      label_column_width: 152
      input_dropdown_height: 32
      input_dropdown_width: full_control_track
      input_dropdown_border: {width: 1, radius: 6, owner: outer_control_only}
      buttons_height: 32
      checkbox: 16
  - id: signal-trim
    trigger: "eligible active Time-pane header action immediately before plot-type selector/overflow"
    testid: signal-trim-dialog
    width: 480
    title: "Обрезать сигнал"
    fields:
      - {id: source, label: "Исходный сигнал", type: standard_select, options_source: eligible_active_time_pane_signals, initial: current_main_signal, required: true}
      - {id: interval, label: "Интервал курсоров", type: readonly_text, boundary: inclusive, order: sorted}
      - {id: target-name, label: "Имя нового сигнала", type: text, required: true, autocomplete: off, max_length: 128, initial: "<source>_фрагмент with lowest free _N suffix", update_on_source_change: while_name_not_user_edited}
      - {id: overwrite, label: "Заменить сигнал с таким именем", type: standard_checkbox_row, checkbox_size: 16, visible_when: target_name_conflicts, initial: unchecked, label_clipping: forbidden}
    actions: [cancel, create, close]
    states: [default, name_invalid, busy, conflict, unavailable_source, empty_interval, provider_error, success]
    focus: {open: target-name, trapped: true, escape_while_idle: close_and_restore_trigger, close_while_busy: blocked, success: close_without_return_focus}
    submit_disabled_when: [no_eligible_source, no_selected_source, invalid_name, unchecked_name_conflict, invalid_cursor_interval, busy]
    semantics: "inclusive samples between sorted X1/X2; preserve source sample rate and data type; returned signal time origin is zero; original signal remains unchanged"
  - id: signal-operation-error
