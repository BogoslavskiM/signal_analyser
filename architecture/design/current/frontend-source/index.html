<body>
  <main id="app" class="app-shell" data-testid="app-shell" aria-label="Анализатор сигналов">
    <div data-zone-slot="toolbar"></div>
    <div class="workspace-inspector-stack" data-testid="workspace-inspector-stack">
      <section class="main-stage" aria-label="Рабочая область и настройки">
        <div data-zone-slot="workspace"></div>
        <div data-zone-slot="settings"></div>
      </section>
      <div class="workspace-inspector-splitter" aria-hidden="true"></div>
      <div data-zone-slot="inspector"></div>
    </div>
    <div data-dialog-slot="signal-operation"></div>
  </main>
  <footer class="app-status" aria-live="polite" hidden>
    <div data-testid="app-loading" role="status" hidden><span data-loading-text>Загрузка данных…</span></div>
    <div data-testid="app-error" role="alert" hidden><span data-error-text></span><button type="button" data-retry>Повторить</button></div>
  </footer>
  <div id="value-select-popup" class="value-select-popup" data-value-select-popup data-testid="select-menu" hidden></div>
  <div id="sample-columns-menu" class="menu inspector-menu sample-columns-menu" role="menu" data-testid="sample-columns-menu" aria-label="Видимость столбцов значений сигнала" hidden></div>
  <script>window.SignalAnalyserUIDesign = window.SignalAnalyserUIDesign || { assetBase: "." };</script>
  <script src="./integration/js/task-0143-bootstrap-loader.js"></script>
  <script src="./integration/js/task-0144-synchronized-ranges.js"></script>
  <script src="./integration/js/task-0146-range-lifecycle.js"></script>

  <script src="./integration/js/task-0152-cursor-trim-signal.js"></script>
  <script src="./integration/js/task-0154-operation-error-dialog.js"></script>
  <script src="./integration/js/task-0158-russian-localization.js"></script>
  <script src="./integration/js/task-0157-preprocess-operation.js"></script>
  <script src="./integration/js/task-0169-primary-processing-operation-validation.js"></script>
  <script src="./js/ui/loader.js"></script>
  <script src="./integration/js/task-0118-color-picker.js"></script>
  <script src="./integration/js/task-0119-context-and-samples-intent.js"></script>

  <script src="./integration/js/task-0140-plot-autoscale.js"></script>
  <script src="./integration/js/task-0141-linked-axes-area-sliders.js"></script>
  <script src="./integration/js/task-0142-range-boundary-validation.js"></script>
  <script src="./integration/js/task-0162-extrema-retry.js"></script>
