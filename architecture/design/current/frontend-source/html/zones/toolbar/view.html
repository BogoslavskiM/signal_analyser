<header class="application-toolbar ui-panel" aria-label="Панель приложения" data-testid="application-toolbar">
  <div class="application-toolbar-brand">
    <img class="application-toolbar-logo" data-asset="icons/engee-logo.svg" alt="Engee">
    <h1 class="application-toolbar-title">Анализатор сигналов</h1>
    <span class="application-toolbar-separator" aria-hidden="true"></span>
    <span class="application-toolbar-version">Версия 0.1.0</span>
  </div>
  <div class="application-toolbar-actions">
    <button class="toolbar-button" type="button" data-testid="toolbar-import" aria-label="Импортировать"><img data-asset="icons/import.svg" alt=""></button>
    <button class="toolbar-button" type="button" data-testid="toolbar-save" aria-label="Сохранить"><img data-asset="icons/save.svg" alt=""></button>
    <button class="toolbar-button" type="button" data-testid="help-action" aria-label="Справка"><img data-asset="icons/help-circle.svg" alt=""></button>
  </div>
</header>
