<section class="inspector ui-panel" data-testid="lower-inspector">
  <header class="inspector-header">
    <div class="inspector-tabs" role="tablist" aria-label="Данные анализатора" data-testid="inspector-tabs"></div>
    <div class="inspector-state-controls" aria-label="Размер нижней зоны">
      <button class="header-chrome-button" type="button" data-testid="inspector-state-up" aria-label="Развернуть нижнюю зону"><span class="triangle up"></span></button>
      <button class="header-chrome-button" type="button" data-testid="inspector-state-down" aria-label="Свернуть нижнюю зону"><span class="triangle down"></span></button>
    </div>
  </header>
  <div class="inspector-body" role="tabpanel" data-testid="inspector-content"></div>
</section>
