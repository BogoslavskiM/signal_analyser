<section class="workspace ui-panel" data-testid="display-workspace" aria-labelledby="workspace-title">
  <header class="workspace-titlebar"><h2 id="workspace-title">Отображение сигналов</h2></header>
  <div class="display-tabs" aria-label="Экраны и действия">
    <div class="display-tablist" role="tablist" aria-label="Экраны" data-testid="display-tabs"></div>
    <div class="display-action-cluster">
      <button class="header-chrome-button" type="button" data-testid="add-display" aria-label="Добавить экран"><img data-asset="icons/plus.svg" alt=""></button>
      <button class="layout-trigger header-chrome-button" type="button" data-testid="layout-trigger" aria-label="Изменить макет"><span class="layout-grid-icon" aria-hidden="true">▦</span><span>2 × 1</span><img data-asset="icons/chevron-down-fill-16.svg" alt=""></button>
    </div>
  </div>
  <div class="plot-grid" data-testid="plot-grid"></div>
</section>
